<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>サステナ経営検定３級 対策問題集300問</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c2b3a;
    --paper:#f3efe4;
    --paper-2:#ece5d3;
    --navy:#20344a;
    --navy-deep:#16232f;
    --gold:#b8912f;
    --gold-soft:#e9d9a8;
    --correct:#3f7d58;
    --correct-bg:#e3ede3;
    --incorrect:#a8462f;
    --incorrect-bg:#f2e2dc;
    --line: rgba(28,43,58,0.14);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--navy-deep);
    font-family: "Noto Sans JP", sans-serif;
    color: var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    background: var(--paper);
    position:relative;
    display:flex;
    flex-direction:column;
    box-shadow: 0 0 60px rgba(0,0,0,0.4);
  }
  .screen{ display:none; flex-direction:column; flex:1; min-height:100vh;}
  .screen.active{ display:flex; }

  /* ===== HEADER (quiz) ===== */
  .quiz-header{
    background: var(--navy);
    color: var(--paper);
    padding: 14px 20px 16px;
    position:sticky; top:0; z-index:5;
  }
  .quiz-header .row1{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:10px;
  }
  .quiz-header .exam-name{
    font-family:"Shippori Mincho", serif;
    font-size:17px; letter-spacing:.04em; color: var(--gold-soft);
  }
  .quiz-header .qnum{
    font-family:"Shippori Mincho", serif;
    font-size:18px; font-weight:700;
  }
  .quiz-header .qnum b{ font-size:26px; color: var(--gold-soft); }
  .progress-track{
    display:flex; gap:3px; height:7px;
  }
  .progress-seg{ flex:1; background: rgba(255,255,255,0.16); border-radius:2px; overflow:hidden;}
  .progress-seg.done{ background: var(--gold); }
  .progress-seg.current{ background: rgba(233,217,168,0.55); }

  /* ===== START SCREEN ===== */
  .start-screen{ padding: 0; }
  .hero{
    background: var(--navy);
    color: var(--paper);
    padding: 56px 28px 40px;
    position:relative;
    overflow:hidden;
  }
  .hero::after{
    content:"";
    position:absolute; right:-40px; top:-40px;
    width:180px; height:180px;
    border:1px solid rgba(233,217,168,0.25);
    border-radius:50%;
  }
  .hero::before{
    content:"";
    position:absolute; right:10px; top:30px;
    width:110px; height:110px;
    border:1px solid rgba(233,217,168,0.18);
    border-radius:50%;
  }
  .hero .eyebrow{
    font-size:13px; color: var(--gold-soft); letter-spacing:.12em; margin-bottom:16px;
  }
  .hero h1{
    font-family:"Shippori Mincho", serif;
    font-weight:700;
    font-size:34px;
    line-height:1.5;
    margin:0 0 16px;
    position:relative; z-index:1;
  }
  .hero p{
    font-size:16px; line-height:1.9; color: rgba(243,239,228,0.85); margin:0;
    max-width: 340px;
    position:relative; z-index:1;
  }
  .exam-list{ padding: 24px 20px 40px; display:flex; flex-direction:column; gap:14px; }
  .exam-card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:2px;
    padding: 20px 20px;
    cursor:pointer;
    position:relative;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .exam-card:active{ transform: scale(0.98); }
  .exam-card .tag{
    display:inline-block;
    font-size:12px;
    color: var(--gold);
    border:1px solid var(--gold);
    padding:3px 9px;
    border-radius: 2px;
    margin-bottom:12px;
    letter-spacing:.05em;
  }
  .exam-card h2{
    font-family:"Shippori Mincho", serif;
    font-size:23px; margin:0 0 8px; color: var(--navy);
  }
  .exam-card .sub{
    font-size:15px; color:#6b6558; margin:0 0 16px; line-height:1.7;
  }
  .exam-card .meta{
    display:flex; justify-content:space-between; align-items:center;
    border-top:1px solid var(--line); padding-top:14px;
  }
  .exam-card .meta span{ font-size:14px; color:#8a8374; }
  .exam-card .go{
    font-size:15px; font-weight:600; color: var(--navy);
    display:flex; align-items:center; gap:6px;
  }
  .exam-card .go svg{ width:16px; height:16px; }

  .footnote{
    padding: 0 24px 34px; font-size:12.5px; color:#8a8374; line-height:1.9;
  }

  /* ===== QUESTION SCREEN ===== */
  .q-body{ padding: 22px 18px 150px; flex:1; }
  .q-theme{
    font-size:14px; color: var(--gold); font-weight:600; margin-bottom:10px; letter-spacing:.03em;
  }
  .q-text{
    font-family:"Shippori Mincho", serif;
    font-size:21px; line-height:1.85; color: var(--navy); margin: 0 0 24px;
    white-space: pre-line;
  }
  .options{ display:flex; flex-direction:column; gap:12px; }
  .option{
    background:#fff;
    border:1.5px solid var(--line);
    border-radius:3px;
    padding:16px 16px;
    display:flex; gap:13px; align-items:flex-start;
    cursor:pointer;
    font-size:18px; line-height:1.7;
    transition: border-color .12s ease, background .12s ease;
  }
  .option:active{ background: var(--paper-2); }
  .option .lab{
    font-family:"Shippori Mincho", serif;
    font-weight:700; color: var(--navy);
    flex-shrink:0;
    width:28px; height:28px;
    border:1.5px solid var(--navy);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:15px;
    margin-top:1px;
  }
  .option.disabled{ pointer-events:none; }
  .option.correct{ border-color: var(--correct); background: var(--correct-bg); }
  .option.correct .lab{ background: var(--correct); border-color: var(--correct); color:#fff; }
  .option.wrong{ border-color: var(--incorrect); background: var(--incorrect-bg); }
  .option.wrong .lab{ background: var(--incorrect); border-color: var(--incorrect); color:#fff; }
  .option.faded{ opacity:.45; }

  /* ===== EXPLANATION PANEL ===== */
  .explain-panel{
    position:fixed; left:0; right:0; bottom:0;
    max-width:480px; margin:0 auto;
    background: var(--navy);
    color: var(--paper);
    border-radius: 16px 16px 0 0;
    padding: 20px 22px calc(20px + env(safe-area-inset-bottom));
    transform: translateY(110%);
    transition: transform .32s cubic-bezier(.22,.9,.35,1);
    box-shadow: 0 -8px 30px rgba(0,0,0,0.35);
    z-index: 20;
  }
  .explain-panel.show{ transform: translateY(0); }
  .explain-head{ display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
  .verdict-badge{
    font-family:"Shippori Mincho", serif;
    font-weight:700; font-size:23px;
    padding: 7px 17px; border-radius: 2px;
  }
  .verdict-badge.ok{ background: var(--correct); color:#fff; }
  .verdict-badge.ng{ background: var(--incorrect); color:#fff; }
  .explain-head .ans{ font-size:19px; color: var(--gold-soft); line-height:1.6; }
  .explain-text{
    font-size:25px; line-height:1.9; color: rgba(243,239,228,0.98);
    max-height: 46vh; overflow-y:auto; margin-bottom:20px; padding-right:4px;
  }
  .explain-ref{
    font-size:16px; color: rgba(233,217,168,0.9); margin-bottom:22px;
  }
  .next-btn{
    width:100%; background: var(--gold); color: var(--navy-deep);
    border:none; border-radius:2px; padding:19px; font-size:20px;
    font-weight:700; font-family:"Noto Sans JP",sans-serif; cursor:pointer;
    letter-spacing:.02em;
  }
  .next-btn:active{ opacity:.85; }

  /* ===== RESULT SCREEN ===== */
  .result-hero{
    background: var(--navy); color: var(--paper);
    padding: 48px 28px 34px; text-align:center; position:relative; overflow:hidden;
  }
  .result-hero .eyebrow{ font-size:13px; color: var(--gold-soft); letter-spacing:.12em; margin-bottom:20px;}
  .score-big{
    font-family:"Shippori Mincho", serif; font-weight:700;
    font-size:64px; line-height:1; color:#fff;
  }
  .score-big span{ font-size:24px; color: var(--gold-soft); margin-left:6px; }
  .score-label{ font-size:15px; color: rgba(243,239,228,0.8); margin-top:12px; }
  .result-list{ padding: 22px 20px 40px; flex:1; }
  .result-list h3{
    font-family:"Shippori Mincho", serif; font-size:17px; color:var(--navy); margin: 4px 0 16px;
  }
  .rgrid{ display:grid; grid-template-columns: repeat(6,1fr); gap:9px; margin-bottom:30px;}
  .rgrid .cell{
    aspect-ratio:1; border-radius:3px; display:flex; align-items:center; justify-content:center;
    font-size:15px; font-weight:700; color:#fff; cursor:pointer;
  }
  .rgrid .cell.ok{ background: var(--correct); }
  .rgrid .cell.ng{ background: var(--incorrect); }
  .result-actions{ display:flex; flex-direction:column; gap:12px; }
  .btn-primary{
    background: var(--navy); color:#fff; border:none; border-radius:2px;
    padding:16px; font-size:17px; font-weight:600; font-family:"Noto Sans JP",sans-serif; cursor:pointer;
  }
  .btn-secondary{
    background:transparent; color: var(--navy); border:1.5px solid var(--navy); border-radius:2px;
    padding:15px; font-size:17px; font-weight:600; font-family:"Noto Sans JP",sans-serif; cursor:pointer;
  }

  /* review detail modal */
  .review-overlay{
    position:fixed; inset:0; background: rgba(22,35,47,0.6); z-index:30;
    display:none; align-items:flex-end; justify-content:center;
  }
  .review-overlay.show{ display:flex; }
  .review-sheet{
    width:100%; max-width:480px; max-height:82vh; overflow-y:auto;
    background:#fff; border-radius:16px 16px 0 0; padding:22px 22px calc(24px + env(safe-area-inset-bottom));
  }
  .review-sheet .close-x{
    width:40px; height:40px; border-radius:50%; background: var(--paper-2); border:none;
    display:flex; align-items:center; justify-content:center; margin-left:auto; margin-bottom:14px; cursor:pointer;
    font-size:16px;
  }
  .review-sheet .rq-theme{ font-size:13.5px; color: var(--gold); font-weight:700; margin-bottom:8px;}
  .review-sheet .rq-text{ font-family:"Shippori Mincho", serif; font-size:19px; line-height:1.8; color:var(--navy); margin-bottom:18px; white-space:pre-line;}
  .review-sheet .ropt{ font-size:16.5px; padding:12px 14px; border-radius:3px; margin-bottom:9px; border:1px solid var(--line); line-height:1.65;}
  .review-sheet .ropt.correct{ background: var(--correct-bg); border-color:var(--correct); }
  .review-sheet .ropt.wrong{ background: var(--incorrect-bg); border-color:var(--incorrect); }
  .review-sheet .rexp{ font-size:22px; line-height:1.95; color:#4a4638; background:var(--paper); padding:17px 18px; border-radius:3px; margin-top:16px;}
  .review-sheet .rref{ font-size:12.5px; color:#8a8374; margin-top:10px;}

  ::-webkit-scrollbar{ width:5px; }
  ::-webkit-scrollbar-thumb{ background: rgba(255,255,255,0.2); border-radius:3px; }

  .progress-bar{height:7px;background:rgba(255,255,255,0.16);border-radius:3px;overflow:hidden}
  .progress-fill{height:100%;background:var(--gold);width:0;transition:width .3s}
  .btn-wrong{background:var(--incorrect);color:#fff;border:none;border-radius:2px;padding:16px;font-size:17px;font-weight:600;font-family:"Noto Sans JP",sans-serif;cursor:pointer}
</style>
</head>
<body>
<div id="app">
  <div class="screen active" id="screen-start">
    <div class="start-screen">
      <div class="hero">
        <div class="eyebrow">SUSTAINA MANAGEMENT CERTIFICATION LV.3</div>
        <h1>サステナ経営検定３級<br>対策問題集 300問</h1>
        <p>1問ずつ答えると、その場で正誤と解説が表示されます。章ごとに挑戦できます。</p>
      </div>
      <div class="exam-list" id="exam-list"></div>
      <div class="footnote">出典：サステナ経営検定3級 対策問題集（300問）</div>
    </div>
  </div>
  <div class="screen" id="screen-quiz">
    <div class="quiz-header">
      <div class="row1">
        <div class="exam-name" id="hdr-exam-name"></div>
        <div class="qnum">問 <b id="hdr-qnum">1</b> / <span id="hdr-qtotal">40</span></div>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    </div>
    <div class="q-body">
      <div class="q-theme" id="q-theme"></div>
      <div class="q-text" id="q-text"></div>
      <div class="options" id="q-options"></div>
    </div>
  </div>
  <div class="screen" id="screen-result">
    <div class="result-hero">
      <div class="eyebrow" id="result-exam-name"></div>
      <div class="score-big"><span id="result-score" style="font-size:64px;color:#fff;margin:0">0</span><span id="result-total">/ 40</span></div>
      <div class="score-label">お疲れさまでした。結果を振り返りましょう。</div>
    </div>
    <div class="result-list">
      <h3>設問別の正誤（タップで解説）</h3>
      <div class="rgrid" id="rgrid"></div>
      <div class="result-actions">
        <button class="btn-wrong" id="btn-wrong">間違えた問題だけ解き直す</button>
        <button class="btn-primary" id="btn-retry">同じ章をもう一度解く</button>
        <button class="btn-secondary" id="btn-home">章を選び直す</button>
      </div>
    </div>
  </div>
  <div class="explain-panel" id="explain-panel">
    <div class="explain-head">
      <div class="verdict-badge" id="verdict-badge">正解</div>
      <div class="ans">正答：<span id="explain-answer"></span></div>
    </div>
    <div class="explain-text" id="explain-text"></div>
    <button class="next-btn" id="btn-next">次の問題へ</button>
  </div>
  <div class="review-overlay" id="review-overlay"><div class="review-sheet" id="review-sheet"></div></div>
</div>
<script>
const CHAPTERS = [{"id": 1, "title": "第1章 サステナ経営・CSR・SDGsの基礎", "questions": [{"num": 1, "text": "企業の経済的側面だけでなく、環境・社会の側面にも配慮した経営を指す言葉として、最も適切なものはどれか。", "options": {"1": "コーポレートガバナンス", "2": "サステナ経営", "3": "リスクマネジメント", "4": "BCP（事業継続計画）"}, "answer": 2, "explanation": "サステナ経営は、企業の持続的な成長を目指し、経済的価値だけでなく、環境（E）、社会（S）、ガバナンス（G）の3つの側面を統合的に考慮する経営アプローチです。"}, {"num": 2, "text": "企業が事業活動を通じて環境・社会に与える影響に責任を持ち、対話を通じて社会の持続可能な発展に貢献する考え方を示す言葉は何か。", "options": {"1": "CSR（企業の社会的責任）", "2": "SRI（社会的責任投資）", "3": "CSV（共通価値の創造）", "4": "BOPビジネス"}, "answer": 1, "explanation": "CSRは、企業が法律遵守や経済的責任を果たすだけでなく、事業活動が社会や環境に与える影響に責任を持ち、ステークホルダーとの対話を通じて社会の持続可能な発展に貢献する考え方です。"}, {"num": 3, "text": "CSRの考え方について、最も適切な説明はどれか。", "options": {"1": "法律で定められた義務を遵守することである。", "2": "主に寄付やボランティアなどの社会貢献活動を指す。", "3": "企業価値向上のための任意活動であり、利益とは無関係である。", "4": "企業が社会や環境に与える負の影響を最小化し、正の影響を最大化する責任である。"}, "answer": 4, "explanation": "CSRは単なる社会貢献活動（フィランソロピー）だけでなく、事業プロセス全体における社会的・環境的責任を果たすことを含みます。"}, {"num": 4, "text": "2015年に国連で採択された、2030年までに持続可能でよりよい世界を目指す国際目標を何というか。", "options": {"1": "ミレニアム開発目標（MDGs）", "2": "パリ協定", "3": "持続可能な開発目標（SDGs）", "4": "京都議定書"}, "answer": 3, "explanation": "SDGs（Sustainable Development Goals）は、2015年9月の国連サミットで採択された「持続可能な開発のための2030アジェンダ」に記載された、2030年までの国際目標です。"}, {"num": 5, "text": "SDGsが掲げる17のゴールのうち、目標1に該当するものはどれか。", "options": {"1": "飢餓をゼロに", "2": "貧困をなくそう", "3": "すべての人に健康と福祉を", "4": "ジェンダー平等を実現しよう"}, "answer": 2, "explanation": "SDGsの目標1は「あらゆる場所のあらゆる形態の貧困を終わらせる」です。"}, {"num": 6, "text": "SDGsの原則である「誰一人取り残さない（Leave No One Behind）」が示す考え方として、最も適切なものはどれか。", "options": {"1": "経済成長を最優先し、その恩恵を分配する。", "2": "途上国の中でも特に開発が遅れている国を重点的に支援する。", "3": "社会的に最も弱い立場にある人々やコミュニティを優先して支援する。", "4": "先進国がリーダーシップを発揮し、世界全体の課題解決を主導する。"}, "answer": 3, "explanation": "「誰一人取り残さない」は、SDGsの中心的な理念であり、最も脆弱な立場にある人々を優先的に考慮することの重要性を示しています。"}, {"num": 7, "text": "SDGsの前身であり、2000年から2015年までの国際社会の目標であったものは何か。", "options": {"1": "アジェンダ21", "2": "リオ宣言", "3": "ミレニアム開発目標（MDGs）", "4": "国連グローバル・コンパクト"}, "answer": 3, "explanation": "MDGsは2000年に採択され、2015年を達成期限とする8つのゴールを掲げ、主に開発途上国における貧困削減などを目指しました。"}, {"num": 8, "text": "MDGsとSDGsの主な違いに関する記述として、誤っているものはどれか。", "options": {"1": "MDGsは主に途上国を対象としていたが、SDGsは先進国を含むすべての国を対象としている。", "2": "MDGsは8つのゴールで構成されていたが、SDGsは17のゴールで構成されている。", "3": "MDGsは政府主導の取り組みが中心だったが、SDGsは企業や市民社会の役割も重視している。", "4": "MDGsは経済成長を重視していたが、SDGsは環境保護のみを重視している。"}, "answer": 4, "explanation": "SDGsは経済・社会・環境の3側面を統合的に扱うことを特徴としており、環境保護のみを重視しているわけではありません。"}, {"num": 9, "text": "企業が法令や社会規範、倫理などを遵守することを何というか。", "options": {"1": "アカウンタビリティ", "2": "コンプライアンス", "3": "ステークホルダー・エンゲージメント", "4": "ディスクロージャー"}, "answer": 2, "explanation": "コンプライアンスは「法令遵守」と訳されますが、より広くは社会規範や企業倫理、社内規則などを遵守することも含みます。"}, {"num": 10, "text": "コンプライアンスの本来の意味として、最も適切なものはどれか。", "options": {"1": "法令さえ守っていれば良いという考え方。", "2": "社会からの要請や期待に応え、誠実に行動すること。", "3": "企業の利益を最大化するためのルール。", "4": "従業員を管理・統制するための内部規則。"}, "answer": 2, "explanation": "現代のコンプライアンスは、単に法律を守るだけでなく、ステークホルダーの期待や社会の要請に応えるという、より積極的で倫理的な行動を意味します。"}, {"num": 11, "text": "SDGsの目標13「気候変動に具体的な対策を」に関連する国際的な枠組みとして、最も適切なものはどれか。", "options": {"1": "生物多様性条約", "2": "パリ協定", "3": "ワシントン条約", "4": "バーゼル条約"}, "answer": 2, "explanation": "パリ協定は2015年のCOP21で採択された気候変動対策の国際的な枠組みであり、SDGs目標13「気候変動に具体的な対策を」と密接に関連しています。"}, {"num": 12, "text": "SDGsの目標5に掲げられているテーマは何か。", "options": {"1": "質の高い教育をみんなに", "2": "ジェンダー平等を実現しよう", "3": "人や国の不平等をなくそう", "4": "平和と公正をすべての人に"}, "answer": 2, "explanation": "SDGsの目標5は「ジェンダー平等を達成し、すべての女性及び女児のエンパワーメントを行う」です。"}, {"num": 13, "text": "SDGsの目標12「つくる責任 つかう責任」が目指すものとして、最も適切なものはどれか。", "options": {"1": "大量生産・大量消費を推進すること。", "2": "持続可能な消費と生産のパターンを確保すること。", "3": "先進国の消費水準を途上国にも広めること。", "4": "製品の価格を可能な限り低く抑えること。"}, "answer": 2, "explanation": "目標12は、資源の効率的な利用、食品ロスの削減、廃棄物の削減など、持続可能な消費と生産のパターンの確保を目指しています。"}, {"num": 14, "text": "SDGsの目標17「パートナーシップで目標を達成しよう」が重視する考え方として、最も適切なものはどれか。", "options": {"1": "各国が独自に目標達成に取り組むべきである。", "2": "先進国のみが途上国を支援すべきである。", "3": "政府、企業、市民社会など多様な主体が連携して取り組むべきである。", "4": "国連機関のみが目標達成の責任を負うべきである。"}, "answer": 3, "explanation": "目標17は、SDGs達成のためにグローバル・パートナーシップを活性化し、多様なステークホルダーの連携を重視しています。"}, {"num": 15, "text": "企業が自社の経営理念やビジョンにSDGsを統合することの意義として、適切でないものはどれか。", "options": {"1": "社会課題の解決を通じて新たなビジネス機会を創出できる。", "2": "従業員のモチベーション向上につながる。", "3": "SDGsに取り組むことで短期的に大幅な利益増加が保証される。", "4": "投資家や消費者からの評価が向上する可能性がある。"}, "answer": 3, "explanation": "SDGsへの取り組みは中長期的な企業価値向上に寄与しますが、短期的な大幅な利益増加が保証されるものではありません。"}, {"num": 16, "text": "「持続可能な開発」の定義として最も広く引用されている、1987年の国連報告書の名称は何か。", "options": {"1": "成長の限界", "2": "沈黙の春", "3": "ブルントラント報告書（我ら共有の未来）", "4": "人間環境宣言"}, "answer": 3, "explanation": "1987年に「環境と開発に関する世界委員会」（ブルントラント委員会）が発表した報告書で、「持続可能な開発」の概念を広く普及させました。"}, {"num": 17, "text": "ブルントラント報告書における「持続可能な開発」の定義として、最も適切なものはどれか。", "options": {"1": "経済成長を最大化しつつ、環境への影響を最小限にする開発。", "2": "将来の世代のニーズを満たす能力を損なうことなく、現在の世代のニーズを満たす開発。", "3": "先進国が途上国の開発を主導する取り組み。", "4": "環境保護を最優先し、経済成長を抑制する開発。"}, "answer": 2, "explanation": "これがブルントラント報告書における「持続可能な開発」の定義として最も広く引用されている表現です。"}, {"num": 18, "text": "1992年にブラジルのリオデジャネイロで開催された、環境と開発に関する国連会議の通称は何か。", "options": {"1": "地球サミット", "2": "ダボス会議", "3": "COP21", "4": "G7サミット"}, "answer": 1, "explanation": "1992年にリオデジャネイロで開催された「環境と開発に関する国連会議」は、通称「地球サミット」と呼ばれ、持続可能な開発の概念が国際的に広まる契機となりました。"}, {"num": 19, "text": "地球サミットで採択された、21世紀に向けた持続可能な開発のための行動計画を何というか。", "options": {"1": "パリ協定", "2": "京都議定書", "3": "アジェンダ21", "4": "リオ宣言"}, "answer": 3, "explanation": "アジェンダ21は、地球サミットで採択された21世紀に向けた持続可能な開発のための包括的な行動計画です。"}, {"num": 20, "text": "CSRの概念を体系的に整理した「CSRのピラミッド」を提唱した学者は誰か。", "options": {"1": "マイケル・ポーター", "2": "アーチー・キャロル", "3": "ピーター・ドラッカー", "4": "ミルトン・フリードマン"}, "answer": 2, "explanation": "アーチー・キャロルは1991年に「CSRのピラミッド」モデルを提唱し、企業の社会的責任を4つの階層（経済的、法的、倫理的、社会貢献的）で整理しました。"}, {"num": 21, "text": "キャロルの「CSRのピラミッド」における4つの責任のうち、最も基盤となるものはどれか。", "options": {"1": "倫理的責任", "2": "法的責任", "3": "経済的責任", "4": "社会貢献的責任"}, "answer": 3, "explanation": "キャロルのCSRピラミッドでは、経済的責任が最も基盤となり、その上に法的責任、倫理的責任、社会貢献的責任が積み重なります。"}, {"num": 22, "text": "キャロルの「CSRのピラミッド」において、法的責任の上に位置する責任は何か。", "options": {"1": "経済的責任", "2": "倫理的責任", "3": "社会貢献的責任", "4": "環境的責任"}, "answer": 2, "explanation": "キャロルのCSRピラミッドは下から「経済的責任→法的責任→倫理的責任→社会貢献的責任」の順に積み上がります。"}, {"num": 23, "text": "SDGsの目標7に掲げられているテーマは何か。", "options": {"1": "安全な水とトイレを世界中に", "2": "エネルギーをみんなに そしてクリーンに", "3": "産業と技術革新の基盤をつくろう", "4": "住み続けられるまちづくりを"}, "answer": 2, "explanation": "SDGsの目標7は「すべての人々の、安価かつ信頼できる持続可能な近代的エネルギーへのアクセスを確保する」です。"}, {"num": 24, "text": "SDGsの目標14「海の豊かさを守ろう」に関連する課題として、適切でないものはどれか。", "options": {"1": "海洋プラスチック汚染", "2": "乱獲による水産資源の枯渇", "3": "海洋酸性化", "4": "都市部の大気汚染"}, "answer": 4, "explanation": "都市部の大気汚染は主にSDGs目標11（住み続けられるまちづくりを）や目標3（すべての人に健康と福祉を）に関連し、目標14「海の豊かさを守ろう」とは直接的な関連が薄いです。"}, {"num": 25, "text": "SDGsの目標15「陸の豊かさも守ろう」が対象とする課題として、最も適切なものはどれか。", "options": {"1": "海洋汚染の防止", "2": "森林の持続可能な管理と砂漠化への対処", "3": "再生可能エネルギーの普及", "4": "安全な飲料水の確保"}, "answer": 2, "explanation": "目標15は陸域生態系の保護・回復・持続可能な利用の推進、森林の持続可能な管理、砂漠化への対処、土地の劣化の阻止・回復、生物多様性の損失の阻止を目指しています。"}, {"num": 26, "text": "SDGsの169のターゲットとは何か。", "options": {"1": "SDGsの17のゴールを達成するための具体的な目標。", "2": "SDGsに取り組む国の数。", "3": "SDGsの達成度を測るための指標の数。", "4": "SDGsに賛同した企業の数。"}, "answer": 1, "explanation": "SDGsの169のターゲットは、17のゴールそれぞれをより具体的に示した目標であり、各ゴールの下に複数のターゲットが設定されています。"}, {"num": 27, "text": "SDGsの達成度を測るために設定された指標の数は、おおよそいくつか。", "options": {"1": "約50", "2": "約100", "3": "約230", "4": "約500"}, "answer": 3, "explanation": "SDGsの達成度を測るために、232の指標（インディケーター）が設定されています。"}, {"num": 28, "text": "企業がSDGsに取り組む際に、自社の事業と関連性の高いゴールを特定するプロセスを何というか。", "options": {"1": "マテリアリティ分析", "2": "SWOT分析", "3": "PEST分析", "4": "バリューチェーン分析"}, "answer": 1, "explanation": "マテリアリティ分析は、自社の事業にとって重要な社会・環境課題を特定するプロセスであり、SDGsへの取り組みの優先順位付けにも活用されます。"}, {"num": 29, "text": "マテリアリティ（重要課題）の特定において考慮すべき2つの軸として、最も適切な組み合わせはどれか。", "options": {"1": "売上高と利益率", "2": "ステークホルダーにとっての重要性と、自社の事業にとっての重要性", "3": "競合他社の動向と市場規模", "4": "法規制の厳しさと技術革新の速度"}, "answer": 2, "explanation": "マテリアリティの特定では、ステークホルダーにとっての重要性と自社の事業にとっての重要性の2軸で評価し、マテリアリティ・マトリクスを作成するのが一般的です。"}, {"num": 30, "text": "企業がSDGsウォッシュ（SDGsに取り組んでいるように見せかけること）を避けるために重要なことは何か。", "options": {"1": "できるだけ多くのSDGsゴールに関連付けて発信する。", "2": "具体的な目標と実績を示し、透明性のある情報開示を行う。", "3": "SDGsのロゴを積極的に使用する。", "4": "他社のSDGs活動を模倣する。"}, "answer": 2, "explanation": "SDGsウォッシュを避けるには、実態を伴った取り組みを行い、具体的な数値目標と実績を透明性をもって開示することが重要です。"}, {"num": 31, "text": "企業の説明責任（アカウンタビリティ）として、最も適切な説明はどれか。", "options": {"1": "株主に対してのみ経営状況を報告する義務。", "2": "ステークホルダーに対して、自社の活動や意思決定の根拠を説明する責任。", "3": "法律で定められた報告書を提出する義務。", "4": "マスメディアからの取材に応じる義務。"}, "answer": 2, "explanation": "アカウンタビリティ（説明責任）は、株主だけでなく、すべてのステークホルダーに対して自社の活動や意思決定について説明する責任を指します。"}, {"num": 32, "text": "企業が自社の経営情報を積極的に公開することを何というか。", "options": {"1": "コンプライアンス", "2": "ディスクロージャー（情報開示）", "3": "ガバナンス", "4": "リスクマネジメント"}, "answer": 2, "explanation": "ディスクロージャーは、企業が経営情報を積極的に公開することを指し、透明性の確保と信頼構築に不可欠な取り組みです。"}, {"num": 33, "text": "企業の透明性を高めるために重要な取り組みとして、適切でないものはどれか。", "options": {"1": "財務情報の適時開示", "2": "CSR報告書やサステナビリティ報告書の発行", "3": "不都合な情報を隠蔽すること", "4": "ステークホルダーとの対話の機会を設けること"}, "answer": 3, "explanation": "不都合な情報の隠蔽は透明性を損なう行為であり、企業の信頼を失墜させる原因となります。"}, {"num": 34, "text": "SDGsの目標8「働きがいも経済成長も」が目指すものとして、最も適切なものはどれか。", "options": {"1": "経済成長を最優先し、労働条件は二の次とする。", "2": "包摂的かつ持続可能な経済成長と、すべての人のための完全かつ生産的な雇用を促進する。", "3": "先進国の経済成長のみを対象とする。", "4": "失業率をゼロにすることを目標とする。"}, "answer": 2, "explanation": "目標8は、ディーセント・ワーク（働きがいのある人間らしい仕事）の推進と持続可能な経済成長の両立を目指しています。"}, {"num": 35, "text": "SDGsの目標10「人や国の不平等をなくそう」に関連する課題として、適切でないものはどれか。", "options": {"1": "所得格差の拡大", "2": "移民や難民に対する差別", "3": "途上国の貿易条件の不利", "4": "宇宙開発の推進"}, "answer": 4, "explanation": "宇宙開発の推進は目標10「人や国の不平等をなくそう」とは直接的な関連がありません。"}, {"num": 36, "text": "SDGsの目標16「平和と公正をすべての人に」が重視する要素として、最も適切なものはどれか。", "options": {"1": "軍事力の強化", "2": "効果的で説明責任のある包摂的な制度の構築", "3": "国際貿易の自由化", "4": "科学技術の発展"}, "answer": 2, "explanation": "目標16は、平和で包摂的な社会の促進、すべての人への司法アクセスの提供、あらゆるレベルにおいて効果的で説明責任のある包摂的な制度の構築を目指しています。"}, {"num": 37, "text": "企業がCSRに取り組む動機として、「社会的免許（License to Operate）」という考え方がある。これが意味するものは何か。", "options": {"1": "政府から事業許可を取得すること。", "2": "社会からの信頼と支持を得て、事業活動を継続する正当性を確保すること。", "3": "環境に関する国際認証を取得すること。", "4": "従業員の資格取得を支援すること。"}, "answer": 2, "explanation": "「社会的免許」とは、法的な許認可とは別に、社会からの信頼と支持を得ることで事業活動を継続する正当性を確保するという考え方です。"}, {"num": 38, "text": "企業のリスクマネジメントにおいて、CSRの観点が重要視される理由として、最も適切なものはどれか。", "options": {"1": "CSRに取り組むことで、すべてのリスクを完全に排除できるため。", "2": "環境問題や人権問題への対応を怠ると、企業の評判や事業継続に深刻な影響を及ぼす可能性があるため。", "3": "CSRに関するリスクは、財務リスクよりも常に重要であるため。", "4": "法律でCSRリスクの管理が義務付けられているため。"}, "answer": 2, "explanation": "環境汚染や人権侵害などのCSRリスクは、企業のレピュテーション（評判）を損ない、訴訟リスクや事業継続リスクにつながる可能性があります。"}, {"num": 39, "text": "企業の非財務情報とは何か。最も適切な説明を選びなさい。", "options": {"1": "売上高や利益など、財務諸表に記載される情報。", "2": "環境、社会、ガバナンスなど、財務諸表には直接表れない企業の活動に関する情報。", "3": "企業の株価に関する情報。", "4": "企業の設立年月日や所在地などの基本情報。"}, "answer": 2, "explanation": "非財務情報は、ESG情報とも呼ばれ、企業の長期的な価値創造能力を評価する上で重要な情報です。"}, {"num": 40, "text": "企業がCSR報告書やサステナビリティ報告書を発行する主な目的として、適切でないものはどれか。", "options": {"1": "ステークホルダーに対する説明責任を果たすこと。", "2": "自社のCSR活動の進捗を把握し、改善につなげること。", "3": "競合他社よりも優れていることをアピールすること。", "4": "社会からの信頼を構築し、企業価値を向上させること。"}, "answer": 3, "explanation": "CSR報告書の主な目的は、ステークホルダーへの説明責任、自社活動の改善、社会的信頼の構築であり、競合他社との優劣をアピールすることではありません。"}, {"num": 41, "text": "SDGsの目標2「飢餓をゼロに」に関連する課題として、最も適切なものはどれか。", "options": {"1": "再生可能エネルギーの普及", "2": "食料安全保障と栄養改善の達成", "3": "海洋資源の保全", "4": "都市のインフラ整備"}, "answer": 2, "explanation": "目標2は「飢餓を終わらせ、食料安全保障及び栄養改善を実現し、持続可能な農業を促進する」ことを目指しています。"}, {"num": 42, "text": "SDGsの目標3「すべての人に健康と福祉を」に関連する取り組みとして、適切でないものはどれか。", "options": {"1": "感染症の予防と治療", "2": "ユニバーサル・ヘルス・カバレッジの達成", "3": "交通事故による死亡者数の半減", "4": "軍事費の増額"}, "answer": 4, "explanation": "軍事費の増額は目標3「すべての人に健康と福祉を」とは関連がありません。"}, {"num": 43, "text": "SDGsの目標4「質の高い教育をみんなに」が目指すものとして、最も適切なものはどれか。", "options": {"1": "先進国の教育水準のみを向上させること。", "2": "すべての人に包摂的かつ公正な質の高い教育を確保し、生涯学習の機会を促進すること。", "3": "高等教育のみを重視すること。", "4": "教育費を無料にすること。"}, "answer": 2, "explanation": "目標4は、先進国・途上国を問わず、すべての人に質の高い教育と生涯学習の機会を提供することを目指しています。"}, {"num": 44, "text": "SDGsの目標6「安全な水とトイレを世界中に」に関連する課題として、適切でないものはどれか。", "options": {"1": "安全な飲料水へのアクセス確保", "2": "衛生施設（トイレ）の普及", "3": "水質汚染の防止", "4": "化石燃料の使用削減"}, "answer": 4, "explanation": "化石燃料の使用削減は主に目標7（エネルギー）や目標13（気候変動）に関連し、目標6「安全な水とトイレを世界中に」とは直接的な関連が薄いです。"}, {"num": 45, "text": "SDGsの目標9「産業と技術革新の基盤をつくろう」が重視する要素として、最も適切なものはどれか。", "options": {"1": "伝統産業の保護のみ", "2": "強靭なインフラ構築、包摂的で持続可能な産業化の促進、イノベーションの推進", "3": "大企業のみの支援", "4": "農業の機械化"}, "answer": 2, "explanation": "目標9は、強靭なインフラの構築、包摂的かつ持続可能な産業化の促進、イノベーションの推進を目指しています。"}, {"num": 46, "text": "SDGsの目標11「住み続けられるまちづくりを」に関連する取り組みとして、適切でないものはどれか。", "options": {"1": "公共交通機関の整備", "2": "文化遺産の保護", "3": "都市部のスラム改善", "4": "農村部の過疎化の促進"}, "answer": 4, "explanation": "農村部の過疎化の促進は持続可能なまちづくりとは逆行する考え方であり、目標11の取り組みとしては適切ではありません。"}, {"num": 47, "text": "企業がCSR活動の成果を評価するために用いる手法として、最も適切なものはどれか。", "options": {"1": "財務諸表の分析のみ", "2": "KPI（重要業績評価指標）の設定と測定", "3": "競合他社との売上比較", "4": "従業員の出勤率の確認"}, "answer": 2, "explanation": "CSR活動の成果を客観的に評価するためには、具体的なKPIを設定し、定期的に測定・報告することが重要です。"}, {"num": 48, "text": "企業のサプライチェーンにおけるCSRとは何か。最も適切な説明を選びなさい。", "options": {"1": "自社の工場内での環境対策のみを指す。", "2": "原材料の調達から製品の廃棄に至るまで、サプライチェーン全体で社会的・環境的責任を果たすこと。", "3": "サプライヤーに対して最低価格での納品を求めること。", "4": "自社製品の品質管理のみを指す。"}, "answer": 2, "explanation": "サプライチェーンCSRは、自社だけでなく、サプライヤーや販売先を含むバリューチェーン全体での責任ある事業活動を意味します。"}, {"num": 49, "text": "SDGsの「5つのP」に含まれないものはどれか。", "options": {"1": "People（人間）", "2": "Planet（地球）", "3": "Prosperity（繁栄）", "4": "Politics（政治）"}, "answer": 4, "explanation": "SDGsの「5つのP」は、People（人間）、Planet（地球）、Prosperity（繁栄）、Peace（平和）、Partnership（パートナーシップ）です。"}, {"num": 50, "text": "SDGsの「5つのP」のうち、「Peace（平和）」と「Partnership（パートナーシップ）」に対応するゴールの組み合わせとして、最も適切なものはどれか。", "options": {"1": "Peace：目標16、Partnership：目標17", "2": "Peace：目標1、Partnership：目標2", "3": "Peace：目標10、Partnership：目標11", "4": "Peace：目標14、Partnership：目標15"}, "answer": 1, "explanation": "Peace（平和）は目標16「平和と公正をすべての人に」、Partnership（パートナーシップ）は目標17「パートナーシップで目標を達成しよう」に対応します。"}, {"num": 51, "text": "企業が社会的責任を果たす上で、「ステークホルダー資本主義」という考え方が注目されている。この考え方の特徴として、最も適切なものはどれか。", "options": {"1": "株主の利益のみを最大化することを目的とする。", "2": "従業員、顧客、地域社会など、すべてのステークホルダーの利益を考慮する。", "3": "政府の規制に従うことのみを重視する。", "4": "短期的な利益を追求する。"}, "answer": 2, "explanation": "ステークホルダー資本主義は、株主至上主義に対する概念であり、すべてのステークホルダーの利益を考慮した経営を目指します。"}, {"num": 52, "text": "2019年にアメリカのビジネス・ラウンドテーブルが発表した声明の内容として、最も適切なものはどれか。", "options": {"1": "株主至上主義を再確認した。", "2": "企業の目的を「株主への利益還元」から「すべてのステークホルダーへの貢献」に転換した。", "3": "企業の社会的責任は不要であると宣言した。", "4": "環境問題への取り組みを企業に義務付けた。"}, "answer": 2, "explanation": "2019年にビジネス・ラウンドテーブルは、企業の目的を株主利益の最大化からすべてのステークホルダーへの貢献に転換する声明を発表しました。"}, {"num": 53, "text": "企業が自社のCSR方針やサステナビリティ戦略を策定する際に、最も重要なステップは何か。", "options": {"1": "競合他社の方針をそのまま採用する。", "2": "自社の事業特性やステークホルダーの期待を踏まえ、マテリアリティ（重要課題）を特定する。", "3": "すべてのSDGsゴールに均等に取り組む計画を立てる。", "4": "外部コンサルタントにすべてを委託する。"}, "answer": 2, "explanation": "効果的なCSR戦略の策定には、自社固有の事業環境やステークホルダーの期待を踏まえたマテリアリティの特定が不可欠です。"}, {"num": 54, "text": "企業のCSR活動において、PDCAサイクルを回すことの意義として、最も適切なものはどれか。", "options": {"1": "一度策定した計画を変更せずに実行し続けること。", "2": "計画（Plan）、実行（Do）、評価（Check）、改善（Act）を繰り返し、活動の質を継続的に向上させること。", "3": "外部からの評価を気にせず、自社のペースで活動すること。", "4": "短期的な成果のみを追求すること。"}, "answer": 2, "explanation": "PDCAサイクルは、CSR活動の継続的な改善を実現するための基本的なマネジメント手法です。"}, {"num": 55, "text": "「サステナビリティ」と「CSR」の関係について、最も適切な説明はどれか。", "options": {"1": "サステナビリティとCSRは全く同じ概念である。", "2": "CSRは企業の責任に焦点を当て、サステナビリティはより広く社会全体の持続可能性を目指す概念である。", "3": "サステナビリティはCSRの一部である。", "4": "CSRは環境問題のみ、サステナビリティは社会問題のみを扱う。"}, "answer": 2, "explanation": "CSRは企業の社会的責任という企業視点の概念であり、サステナビリティはより広く社会・経済・環境の持続可能性を包括する概念です。"}, {"num": 56, "text": "企業が「統合思考」を実践するとは、どのようなことを意味するか。", "options": {"1": "財務部門と人事部門を統合すること。", "2": "財務的価値と社会的・環境的価値を一体的に捉え、経営戦略に組み込むこと。", "3": "複数の事業部門を一つに統合すること。", "4": "国内事業と海外事業を統合すること。"}, "answer": 2, "explanation": "統合思考は、財務資本だけでなく、人的資本、知的資本、自然資本など多様な資本の相互関係を理解し、経営戦略に反映させる考え方です。"}, {"num": 57, "text": "日本において、上場企業に対してサステナビリティに関する情報開示を求める動きが強まっている。その背景として、適切でないものはどれか。", "options": {"1": "投資家がESG情報を投資判断に活用するようになったため。", "2": "気候変動リスクが企業の財務に影響を与えることが認識されたため。", "3": "サステナビリティ情報の開示は企業の競争力を低下させるため。", "4": "国際的な開示基準の整備が進んでいるため。"}, "answer": 3, "explanation": "サステナビリティ情報の開示は企業の透明性を高め、投資家やステークホルダーからの信頼を獲得することにつながるため、競争力を低下させるという認識は誤りです。"}, {"num": 58, "text": "SDGsの目標の中で、「パートナーシップ」の重要性を最も直接的に示しているゴールはどれか。", "options": {"1": "目標1「貧困をなくそう」", "2": "目標10「人や国の不平等をなくそう」", "3": "目標16「平和と公正をすべての人に」", "4": "目標17「パートナーシップで目標を達成しよう」"}, "answer": 4, "explanation": "目標17は、SDGs達成のためのグローバル・パートナーシップの活性化を直接的に掲げています。"}, {"num": 59, "text": "企業のCSR活動において、自社の強みや本業と関連性の高い分野で社会貢献活動を行うことの利点として、最も適切なものはどれか。", "options": {"1": "従業員の専門知識やスキルを活かすことができ、活動の効果が高まる。", "2": "活動にかかる費用を最小限に抑えることができる。", "3": "他社の活動と差別化する必要がなくなる。", "4": "社会からの評価を気にせずに活動できる。"}, "answer": 1, "explanation": "本業と関連性の高い分野でCSR活動を行うことで、企業の専門性を活かした効果的な社会貢献が可能になります。"}, {"num": 60, "text": "企業がCSR活動を推進する上で、最も重要な基盤となるものは何か。", "options": {"1": "経営トップの強いリーダーシップとコミットメント", "2": "広報部門による積極的な情報発信", "3": "競合他社の動向分析", "4": "短期的な利益目標の達成"}, "answer": 1, "explanation": "CSR活動を組織全体で推進するためには、経営トップが明確なビジョンを示し、強いリーダーシップを発揮することが最も重要な基盤となります。"}]}, {"id": 2, "title": "第2章 国際規格・枠組み・ESG投資", "questions": [{"num": 61, "text": "組織の社会的責任に関する手引きとして、2010年に発行された国際規格は何か。", "options": {"1": "ISO 9001", "2": "ISO 14001", "3": "ISO 26000", "4": "ISO 45001"}, "answer": 3, "explanation": "ISO 26000は2010年に発行された、組織の社会的責任に関するガイダンス規格です。認証規格ではなく、あらゆる組織が参考にできる手引書です。"}, {"num": 62, "text": "ISO 26000が定めている「7つの中核主題」に含まれないものはどれか。", "options": {"1": "人権", "2": "労働慣行", "3": "製品の価格設定", "4": "コミュニティへの参画及びコミュニティの発展"}, "answer": 3, "explanation": "ISO 26000の7つの中核主題は、組織統治、人権、労働慣行、環境、公正な事業慣行、消費者課題、コミュニティへの参画及びコミュニティの発展です。"}, {"num": 63, "text": "ISO 26000の大きな特徴として、正しいものはどれか。", "options": {"1": "第三者認証を目的とした要求事項規格である。", "2": "企業のみを対象とした規格である。", "3": "ガイダンス規格（手引書）であり、任意で利用されるものである。", "4": "違反した場合、法的な罰則が科される。"}, "answer": 3, "explanation": "ISO 26000は認証を目的とした要求事項規格ではなく、あらゆる種類の組織が社会的責任を果たすための手引書（ガイダンス規格）です。"}, {"num": 64, "text": "企業が人権、労働、環境、腐敗防止に関する10の原則を支持し、実践することを求める国連の自主的な取り組みを何というか。", "options": {"1": "国連開発計画（UNDP）", "2": "国連環境計画（UNEP）", "3": "国連グローバル・コンパクト（UNGC）", "4": "国連人権理事会（UNHRC）"}, "answer": 3, "explanation": "UNGCは2000年に発足し、人権、労働、環境、腐敗防止の4分野10原則を掲げ、企業の自主的な取り組みを促進しています。"}, {"num": 65, "text": "国連グローバル・コンパクトの10原則のうち、「人権」の分野に含まれる原則はどれか。", "options": {"1": "結社の自由と団体交渉権の効果的な承認", "2": "強制労働の撤廃", "3": "企業は、人権擁護を支持、尊重すべきこと", "4": "環境問題の予防的アプローチを支持すること"}, "answer": 3, "explanation": "UNGCの10原則のうち、人権分野には「原則1：人権擁護の支持と尊重」と「原則2：人権侵害への非加担」が含まれます。"}, {"num": 66, "text": "企業が経済・環境・社会のパフォーマンスを報告するための、サステナビリティ報告に関する国際的なガイドラインを策定している機関はどこか。", "options": {"1": "GRI（グローバル・レポーティング・イニシアティブ）", "2": "IFRS財団", "3": "CDP（旧カーボン・ディスクロージャー・プロジェクト）", "4": "SASB（サステナビリティ会計基準審議会）"}, "answer": 1, "explanation": "GRIは1997年に設立され、サステナビリティ報告のための国際的なガイドライン（GRIスタンダード）を策定しています。"}, {"num": 67, "text": "2022年にIFRS財団傘下に設立され、サステナビリティ関連の開示基準のグローバルなベースラインを開発する機関は何か。", "options": {"1": "GRI", "2": "ISSB（国際サステナビリティ基準審議会）", "3": "TCFD（気候関連財務情報開示タスクフォース）", "4": "NFRD（非財務情報開示指令）"}, "answer": 2, "explanation": "ISSBは2021年のCOP26で設立が発表され、2022年にIFRS財団傘下に正式に設立されました。グローバルなサステナビリティ開示基準のベースラインを開発しています。"}, {"num": 68, "text": "投資家が投資先を選ぶ際に、従来の財務情報だけでなく、環境（Environment）、社会（Social）、ガバナンス（Governance）の要素も考慮する投資を何というか。", "options": {"1": "インパクト投資", "2": "ベンチャーキャピタル", "3": "ESG投資", "4": "エンジェル投資"}, "answer": 3, "explanation": "ESG投資は、環境（E）、社会（S）、ガバナンス（G）の要素を投資判断に組み込む投資手法の総称です。"}, {"num": 69, "text": "ESG投資の「S（社会）」の評価項目に含まれないものはどれか。", "options": {"1": "従業員の健康と安全", "2": "製品の安全性", "3": "取締役会の多様性", "4": "サプライチェーンにおける人権配慮"}, "answer": 3, "explanation": "取締役会の多様性はESGの「G（ガバナンス）」に分類されます。「S（社会）」には従業員の健康・安全、製品安全性、人権配慮などが含まれます。"}, {"num": 70, "text": "ESG投資の一つの手法で、特定の業界（例：タバコ、武器製造など）を投資対象から除外する方法を何というか。", "options": {"1": "ポジティブ・スクリーニング", "2": "ネガティブ・スクリーニング", "3": "インテグレーション", "4": "エンゲージメント"}, "answer": 2, "explanation": "ネガティブ・スクリーニングは、倫理的・社会的・環境的な基準に基づき、特定の業界や企業を投資対象から除外する手法です。"}, {"num": 71, "text": "ESG投資の手法で、ESG評価の高い企業を積極的に投資対象に組み入れる方法を何というか。", "options": {"1": "ネガティブ・スクリーニング", "2": "ポジティブ・スクリーニング（ベスト・イン・クラス）", "3": "ダイベストメント", "4": "インデックス投資"}, "answer": 2, "explanation": "ポジティブ・スクリーニングは、ESG評価の高い企業を積極的に投資対象に選定する手法で、ベスト・イン・クラスとも呼ばれます。"}, {"num": 72, "text": "投資家が株主として企業に対し、ESGに関する改善を直接求める活動を何というか。", "options": {"1": "ネガティブ・スクリーニング", "2": "インパクト投資", "3": "エンゲージメント（対話）", "4": "パッシブ運用"}, "answer": 3, "explanation": "エンゲージメントは、投資家が株主として企業経営陣と直接対話し、ESGに関する改善を働きかける活動です。"}, {"num": 73, "text": "社会的・環境的な課題解決を主な目的とし、その成果（インパクト）を重視する投資を何というか。", "options": {"1": "ESG投資", "2": "インパクト投資", "3": "ポジティブ・スクリーニング", "4": "SRI"}, "answer": 2, "explanation": "インパクト投資は、財務的リターンだけでなく、社会的・環境的なインパクト（成果）の創出を意図して行われる投資です。"}, {"num": 74, "text": "2006年に国連が支援して策定された、機関投資家がESG課題を投資プロセスに組み込むための原則を何というか。", "options": {"1": "赤道原則", "2": "責任投資原則（PRI）", "3": "国連グローバル・コンパクト", "4": "スチュワードシップ・コード"}, "answer": 2, "explanation": "PRI（Principles for Responsible Investment）は2006年に国連の支援のもと策定され、機関投資家がESG課題を投資の意思決定プロセスに組み込むための6つの原則を定めています。"}, {"num": 75, "text": "日本版スチュワードシップ・コードの目的として、最も適切なものはどれか。", "options": {"1": "企業の短期的な利益を最大化すること。", "2": "機関投資家が投資先企業との対話を通じて、企業の持続的成長を促すこと。", "3": "個人投資家の権利を保護すること。", "4": "企業の株価を安定させること。"}, "answer": 2, "explanation": "日本版スチュワードシップ・コードは、機関投資家が投資先企業との建設的な対話（エンゲージメント）を通じて、企業の持続的成長を促し、中長期的な投資リターンの拡大を図ることを目的としています。"}, {"num": 76, "text": "日本のコーポレートガバナンス・コードにおいて、上場企業に求められている事項として、適切でないものはどれか。", "options": {"1": "株主の権利・平等性の確保", "2": "ステークホルダーとの適切な協働", "3": "適切な情報開示と透明性の確保", "4": "従業員の給与を毎年引き上げること"}, "answer": 4, "explanation": "コーポレートガバナンス・コードは、株主の権利・平等性の確保、ステークホルダーとの協働、情報開示と透明性の確保、取締役会等の責務、株主との対話の5つの基本原則を定めています。"}, {"num": 77, "text": "環境マネジメントシステムに関する国際規格は何か。", "options": {"1": "ISO 9001", "2": "ISO 14001", "3": "ISO 26000", "4": "ISO 27001"}, "answer": 2, "explanation": "ISO 14001は環境マネジメントシステム（EMS）に関する国際規格で、組織が環境パフォーマンスを継続的に改善するための枠組みを提供します。"}, {"num": 78, "text": "品質マネジメントシステムに関する国際規格は何か。", "options": {"1": "ISO 14001", "2": "ISO 9001", "3": "ISO 45001", "4": "ISO 50001"}, "answer": 2, "explanation": "ISO 9001は品質マネジメントシステム（QMS）に関する国際規格で、製品やサービスの品質を継続的に改善するための枠組みを提供します。"}, {"num": 79, "text": "労働安全衛生マネジメントシステムに関する国際規格は何か。", "options": {"1": "ISO 14001", "2": "ISO 9001", "3": "ISO 45001", "4": "ISO 26000"}, "answer": 3, "explanation": "ISO 45001は労働安全衛生マネジメントシステム（OH&S）に関する国際規格で、労働者の安全と健康を守るための枠組みを提供します。"}, {"num": 80, "text": "SASB（サステナビリティ会計基準審議会）の特徴として、最も適切なものはどれか。", "options": {"1": "すべての業種に共通の開示基準を設定している。", "2": "業種ごとに異なるサステナビリティ開示基準を設定している。", "3": "環境情報のみの開示を求めている。", "4": "途上国の企業のみを対象としている。"}, "answer": 2, "explanation": "SASBは77の業種別にサステナビリティ開示基準を設定しており、各業種に特有の重要なESG課題に焦点を当てています。"}, {"num": 81, "text": "GRIスタンダードの特徴として、最も適切なものはどれか。", "options": {"1": "投資家のみを対象とした開示基準である。", "2": "マルチステークホルダーを対象とし、企業が社会・環境に与える影響の報告を重視する。", "3": "財務情報のみの開示を求めている。", "4": "日本国内でのみ使用される基準である。"}, "answer": 2, "explanation": "GRIスタンダードは、投資家だけでなく幅広いステークホルダーを対象とし、企業の経済・環境・社会への影響を包括的に報告することを重視しています。"}, {"num": 82, "text": "ISSBが発行した最初の2つの基準（IFRS S1とIFRS S2）のうち、IFRS S2が対象とするテーマは何か。", "options": {"1": "生物多様性", "2": "気候関連開示", "3": "人権", "4": "水資源"}, "answer": 2, "explanation": "IFRS S1は「サステナビリティ関連財務情報の開示に関する全般的要求事項」、IFRS S2は「気候関連開示」を対象としています。"}, {"num": 83, "text": "金融機関が大規模プロジェクトへの融資を行う際に、環境・社会リスクを評価するための枠組みを何というか。", "options": {"1": "責任投資原則（PRI）", "2": "赤道原則（エクエーター原則）", "3": "国連グローバル・コンパクト", "4": "スチュワードシップ・コード"}, "answer": 2, "explanation": "赤道原則は、大規模プロジェクトへの融資における環境・社会リスクの評価・管理のための金融業界の自主的な枠組みです。"}, {"num": 84, "text": "グリーンボンドとは何か。最も適切な説明を選びなさい。", "options": {"1": "環境に配慮した製品を製造する企業の株式。", "2": "環境改善プロジェクトの資金調達を目的として発行される債券。", "3": "環境税の一種。", "4": "環境保護団体への寄付金。"}, "answer": 2, "explanation": "グリーンボンドは、再生可能エネルギーや省エネルギーなど、環境改善に資するプロジェクトの資金を調達するために発行される債券です。"}, {"num": 85, "text": "ソーシャルボンドとは何か。最も適切な説明を選びなさい。", "options": {"1": "SNSを活用したマーケティング手法。", "2": "社会課題の解決に資するプロジェクトの資金調達を目的として発行される債券。", "3": "社会保険料の一種。", "4": "社会貢献活動への参加証明書。"}, "answer": 2, "explanation": "ソーシャルボンドは、貧困対策、教育、医療など、社会課題の解決に貢献するプロジェクトの資金を調達するために発行される債券です。"}, {"num": 86, "text": "サステナビリティ・リンク・ローンの特徴として、最も適切なものはどれか。", "options": {"1": "資金使途が環境プロジェクトに限定されている。", "2": "借り手のサステナビリティ目標の達成度に応じて、融資条件が変動する。", "3": "返済義務がないローンである。", "4": "政府からの補助金である。"}, "answer": 2, "explanation": "サステナビリティ・リンク・ローンは、借り手が設定したサステナビリティ・パフォーマンス・ターゲット（SPT）の達成度に応じて金利等の融資条件が変動する仕組みです。"}, {"num": 87, "text": "TCFD（気候関連財務情報開示タスクフォース）を設立した機関はどこか。", "options": {"1": "国連", "2": "世界銀行", "3": "金融安定理事会（FSB）", "4": "国際通貨基金（IMF）"}, "answer": 3, "explanation": "TCFDは2015年に金融安定理事会（FSB）によって設立され、気候関連の財務情報開示に関する提言を2017年に公表しました。"}, {"num": 88, "text": "TCFDが企業に開示を推奨している4つの項目に含まれないものはどれか。", "options": {"1": "ガバナンス", "2": "戦略", "3": "従業員満足度", "4": "リスク管理"}, "answer": 3, "explanation": "TCFDが開示を推奨する4つの項目は、ガバナンス、戦略、リスク管理、指標と目標です。"}, {"num": 89, "text": "TCFDが推奨するシナリオ分析とは何か。最も適切な説明を選びなさい。", "options": {"1": "過去の財務データを分析すること。", "2": "気候変動に関する複数の将来シナリオ（例：2℃シナリオ、4℃シナリオ）を想定し、企業への影響を分析すること。", "3": "競合他社の戦略を分析すること。", "4": "株価の将来予測を行うこと。"}, "answer": 2, "explanation": "シナリオ分析は、気候変動の物理的リスクと移行リスクが企業に与える影響を、複数の将来シナリオに基づいて分析する手法です。"}, {"num": 90, "text": "企業の温室効果ガス排出量の算定において、自社の直接排出（燃料の燃焼など）を何というか。", "options": {"1": "Scope 1", "2": "Scope 2", "3": "Scope 3", "4": "Scope 4"}, "answer": 1, "explanation": "Scope 1は、自社が直接排出する温室効果ガス（自社の工場や車両での燃料燃焼など）を指します。"}, {"num": 91, "text": "企業の温室効果ガス排出量の算定において、購入した電力・熱の使用に伴う間接排出を何というか。", "options": {"1": "Scope 1", "2": "Scope 2", "3": "Scope 3", "4": "Scope 4"}, "answer": 2, "explanation": "Scope 2は、自社が購入した電力、蒸気、熱、冷却の使用に伴う間接排出を指します。"}, {"num": 92, "text": "Scope 3に該当する排出として、最も適切なものはどれか。", "options": {"1": "自社工場でのガス燃焼による排出", "2": "自社が購入した電力の使用に伴う排出", "3": "従業員の通勤や出張に伴う排出", "4": "自社の社用車の走行に伴う排出"}, "answer": 3, "explanation": "Scope 3は、Scope 1・2以外のサプライチェーン全体の間接排出であり、従業員の通勤・出張、原材料の調達、製品の使用・廃棄などが含まれます。"}, {"num": 93, "text": "企業が温室効果ガス排出量を算定・報告するための国際的な基準は何か。", "options": {"1": "パリ協定", "2": "GHGプロトコル", "3": "ISO 14001", "4": "RE100"}, "answer": 2, "explanation": "GHGプロトコルは、WRI（世界資源研究所）とWBCSD（持続可能な開発のための世界経済人会議）が共同で策定した、温室効果ガスの算定・報告に関する国際的な基準です。"}, {"num": 94, "text": "パリ協定の目標と整合した、科学的根拠に基づく温室効果ガス排出削減目標を何というか。", "options": {"1": "RE100", "2": "EP100", "3": "SBT（Science Based Targets）", "4": "CDP"}, "answer": 3, "explanation": "SBTは、パリ協定の目標（産業革命前からの気温上昇を2℃未満、できれば\n1.5℃に抑える）と整合した、科学的根拠に基づく温室効果ガス排出削減目標です。"}, {"num": 95, "text": "RE100に参加する企業が目指すことは何か。", "options": {"1": "温室効果ガス排出量を実質ゼロにすること。", "2": "事業活動で使用する電力を100%再生可能エネルギーで調達すること。", "3": "エネルギー効率を100%改善すること。", "4": "電気自動車を100%導入すること。"}, "answer": 2, "explanation": "RE100（Renewable Energy 100%）は、事業活動で使用する電力を100%再生可能エネルギーで調達することを目指す国際的なイニシアティブです。"}, {"num": 96, "text": "カーボンニュートラルとは何か。最も適切な説明を選びなさい。", "options": {"1": "温室効果ガスの排出を完全にゼロにすること。", "2": "温室効果ガスの排出量と吸収量を均衡させ、実質的にゼロにすること。", "3": "化石燃料の使用を完全に禁止すること。", "4": "森林を増やすことのみを指す。"}, "answer": 2, "explanation": "カーボンニュートラルは、排出を完全にゼロにするのではなく、排出量から吸収量・除去量を差し引いて実質ゼロにすることを意味します。"}, {"num": 97, "text": "日本政府が宣言した、温室効果ガス排出量を実質ゼロにする目標年は何年か。", "options": {"1": "2030年", "2": "2040年", "3": "2050年", "4": "2060年"}, "answer": 3, "explanation": "日本政府は2020年10月に、2050年までに温室効果ガスの排出を全体としてゼロにする「2050年カーボンニュートラル」を宣言しました。"}, {"num": 98, "text": "カーボンプライシングの手法として、適切でないものはどれか。", "options": {"1": "炭素税", "2": "排出量取引制度", "3": "カーボンクレジット", "4": "所得税の引き上げ"}, "answer": 4, "explanation": "カーボンプライシングの手法には、炭素税、排出量取引制度、カーボンクレジットなどがあります。所得税の引き上げはカーボンプライシングではありません。"}, {"num": 99, "text": "CDPが企業に対して開示を求める環境情報の分野として、含まれないものはどれか。", "options": {"1": "気候変動", "2": "水セキュリティ", "3": "森林", "4": "従業員の給与水準"}, "answer": 4, "explanation": "CDPは気候変動、水セキュリティ、森林の3つの分野で企業に環境情報の開示を求めています。"}, {"num": 100, "text": "企業がサステナビリティに関する取り組みを外部に発信する際に、最も重要な原則は何か。", "options": {"1": "ポジティブな情報のみを発信すること。", "2": "正確性、透明性、バランスのとれた情報開示を行うこと。", "3": "競合他社よりも多くの情報を発信すること。", "4": "専門用語を多用して専門性をアピールすること。"}, "answer": 2, "explanation": "サステナビリティ情報の発信においては、ポジティブな面だけでなく課題も含め、正確で透明性のある、バランスのとれた情報開示が最も重要です。"}, {"num": 101, "text": "GHGプロトコルにおいて、サプライチェーン全体の排出量を把握するために最も重要なスコープはどれか。", "options": {"1": "Scope 1", "2": "Scope 2", "3": "Scope 3", "4": "すべてのスコープを総合的に把握することが重要"}, "answer": 4, "explanation": "サプライチェーン全体の排出量を把握するにはScope 3が重要ですが、Scope 1・2を含むすべてのスコープを総合的に把握することが求められます。"}, {"num": 102, "text": "企業が自社の温室効果ガス排出量を削減しきれない分を、他の場所での排出削減・吸収プロジェクトで相殺する仕組みを何というか。", "options": {"1": "カーボンニュートラル", "2": "カーボンオフセット", "3": "カーボンフットプリント", "4": "カーボンバジェット"}, "answer": 2, "explanation": "カーボンオフセットは、自社で削減しきれない温室効果ガス排出量を、他の場所での排出削減・吸収プロジェクトへの投資によって相殺する仕組みです。"}, {"num": 103, "text": "EUが導入を進めている、輸入品に対してその製造過程で排出された炭素に応じた課金を行う制度を何というか。", "options": {"1": "EU ETS（EU排出量取引制度）", "2": "CBAM（炭素国境調整メカニズム）", "3": "EU タクソノミー", "4": "CSRD（企業サステナビリティ報告指令）"}, "answer": 2, "explanation": "CBAMは、EU域外からの輸入品に対して、その製造過程で排出された炭素に応じた課金を行う制度で、カーボンリーケージの防止を目的としています。"}, {"num": 104, "text": "EUタクソノミーとは何か。最も適切な説明を選びなさい。", "options": {"1": "EUにおける環境税の一種。", "2": "環境的に持続可能な経済活動を分類するためのEUの枠組み。", "3": "EU域内の企業に対する環境規制。", "4": "EUの環境保護団体のネットワーク。"}, "answer": 2, "explanation": "EUタクソノミーは、どの経済活動が環境的に持続可能であるかを分類するための統一的な枠組みであり、グリーンウォッシュの防止にも役立ちます。"}, {"num": 105, "text": "EUが2024年から段階的に適用を開始した、企業のサステナビリティ報告に関する新たな指令は何か。", "options": {"1": "NFRD（非財務情報開示指令）", "2": "CSRD（企業サステナビリティ報告指令）", "3": "SFDR（サステナブルファイナンス開示規則）", "4": "MiFID II"}, "answer": 2, "explanation": "CSRDは、従来のNFRD（非財務情報開示指令）を大幅に強化した新たな指令で、対象企業の拡大やダブル・マテリアリティの導入などが特徴です。"}, {"num": 106, "text": "国連グローバル・コンパクトの10原則のうち、「腐敗防止」の分野に含まれる原則の内容として、最も適切なものはどれか。", "options": {"1": "児童労働の実効的な撤廃", "2": "環境に対するより大きな責任を率先すること", "3": "強要と贈収賄を含むあらゆる形態の腐敗の防止に取り組むべきこと", "4": "雇用と職業における差別の撤廃"}, "answer": 3, "explanation": "UNGCの10原則のうち、腐敗防止分野は「原則10：強要と贈収賄を含むあらゆる形態の腐敗の防止に取り組むべき」です。"}, {"num": 107, "text": "日本において、金融庁が策定した「スチュワードシップ・コード」の対象となる主な機関は何か。", "options": {"1": "上場企業", "2": "機関投資家", "3": "証券取引所", "4": "中小企業"}, "answer": 2, "explanation": "スチュワードシップ・コードは、機関投資家（年金基金、保険会社、投資信託など）を対象とした行動規範です。"}, {"num": 108, "text": "「ダブル・マテリアリティ」の考え方として、最も適切なものはどれか。", "options": {"1": "企業にとっての財務的な重要性のみを考慮する。", "2": "企業が社会・環境に与える影響と、社会・環境が企業の財務に与える影響の両方を考慮する。", "3": "2つの異なる業界の重要課題を比較する。", "4": "短期的な重要性と長期的な重要性を区別する。"}, "answer": 2, "explanation": "ダブル・マテリアリティは、企業が外部に与える影響（インパクト・マテリアリティ）と、外部環境が企業の財務に与える影響（財務マテリアリティ）の両方を考慮する考え方です。"}, {"num": 109, "text": "自治体がSDGsの達成に向けて、地域の企業や団体、市民と連携して取り組むことの意義として、最も適切でないものはどれか。", "options": {"1": "地域の多様な主体が持つ資源や知見を活用できる。", "2": "地域の特性に応じた独自の課題解決策を生み出すことができる。", "3": "自治体単独ですべての課題を解決できるため、連携は不要である。", "4": "地域の住民や企業のSDGsへの意識を高め、行動変容を促すことができる。"}, "answer": 3, "explanation": "SDGsの課題は複雑で多岐にわたるため、自治体単独ではなく、企業、団体、市民など多様な主体との連携が不可欠です。"}, {"num": 110, "text": "日本政府がSDGs達成に向けた国内の取り組みを推進するために設置した、総理大臣を本部長とする組織は何か。", "options": {"1": "SDGs推進円卓会議", "2": "SDGs推進本部", "3": "ジャパンSDGsアワード", "4": "地方創生SDGs官民連携プラットフォーム"}, "answer": 2, "explanation": "SDGs推進本部は、2016年に内閣に設置された、総理大臣を本部長とする組織で、日本のSDGs達成に向けた施策を総合的かつ効果的に推進しています。"}]}, {"id": 3, "title": "第3章 企業と社会・ステークホルダー", "questions": [{"num": 111, "text": "企業活動に直接的または間接的に利害関係を持つ人々や組織を総称して何と呼ぶか。", "options": {"1": "株主", "2": "顧客", "3": "ステークホルダー", "4": "サプライヤー"}, "answer": 3, "explanation": "ステークホルダーとは、企業活動に直接的・間接的に利害関係を持つすべての人々や組織を指し、株主、従業員、顧客、取引先、地域社会、政府などが含まれます。"}, {"num": 112, "text": "以下のうち、企業の内部ステークホルダーに分類されるのはどれか。", "options": {"1": "顧客", "2": "従業員", "3": "地域社会", "4": "政府"}, "answer": 2, "explanation": "内部ステークホルダーには、株主、経営者、従業員などが含まれます。顧客、地域社会、政府は外部ステークホルダーに分類されます。"}, {"num": 113, "text": "企業がステークホルダーと対話し、その意見や期待を経営に反映させるプロセスを何というか。", "options": {"1": "コーポレート・コミュニケーション", "2": "IR（インベスター・リレーションズ）", "3": "ステークホルダー・エンゲージメント", "4": "パブリック・リレーションズ"}, "answer": 3, "explanation": "ステークホルダー・エンゲージメントは、企業がステークホルダーと積極的に対話し、その意見や期待を経営に反映させるプロセスです。"}, {"num": 114, "text": "ステークホルダー・エンゲージメントの目的として、適切でないものはどれか。", "options": {"1": "企業の意思決定に対するステークホルダーの理解と支持を得る。", "2": "ステークホルダーからの批判を一切受け付けないようにする。", "3": "企業の事業活動に伴うリスクや機会を特定する。", "4": "ステークホルダーとの信頼関係を構築し、企業価値を向上させる。"}, "answer": 2, "explanation": "ステークホルダー・エンゲージメントは、批判も含めた多様な意見を受け入れ、建設的な対話を通じて相互理解を深めることを目的としています。"}, {"num": 115, "text": "消費者の権利を保護し、企業の公正な事業活動を促進することを目的とした考え方を何というか。", "options": {"1": "顧客満足（CS）", "2": "顧客関係管理（CRM）", "3": "消費者志向経営", "4": "プロダクト・ライフサイクル・マネジメント"}, "answer": 3, "explanation": "消費者志向経営は、消費者の権利を尊重し、消費者の安全・安心を確保しながら、公正な事業活動を行う経営姿勢を指します。"}, {"num": 116, "text": "ジョン・エルキントンが提唱した、企業が経済的側面、環境的側面、社会的側面の3つの側面で成果を測定・報告すべきだとする考え方を何というか。", "options": {"1": "バランスト・スコアカード", "2": "トリプルボトムライン", "3": "シックス・シグマ", "4": "PDCAサイクル"}, "answer": 2, "explanation": "トリプルボトムラインは、ジョン・エルキントンが1994年に提唱した概念で、企業の成果を経済（Proﬁt）、環境（Planet）、社会（People）の3つの側面で評価すべきだとする考え方です。"}, {"num": 117, "text": "トリプルボトムラインにおける「3つのP」に含まれないものはどれか。", "options": {"1": "Proﬁt（利益）", "2": "People（人々）", "3": "Planet（地球）", "4": "Politics（政治）"}, "answer": 4, "explanation": "トリプルボトムラインの「3つのP」は、Proﬁt（利益）、People（人々）、Planet（地球）です。"}, {"num": 118, "text": "企業が自社の利益追求だけでなく、事業を通じて社会課題の解決に貢献することで、経済的価値と社会的価値の両方を創造するという考え方を何というか。", "options": {"1": "CSR（企業の社会的責任）", "2": "CSV（共通価値の創造）", "3": "BOPビジネス", "4": "フィランソロピー"}, "answer": 2, "explanation": "CSV（Creating Shared Value）は、企業が事業活動を通じて社会課題を解決しながら、同時に経済的価値も創造するという考え方です。"}, {"num": 119, "text": "CSV（共通価値の創造）を提唱した経営学者は誰か。", "options": {"1": "ピーター・ドラッカー", "2": "フィリップ・コトラー", "3": "マイケル・ポーター", "4": "クレイトン・クリステンセン"}, "answer": 3, "explanation": "マイケル・ポーターとマーク・クラマーが2011年に「Creating Shared Value」の論文を発表し、CSVの概念を提唱しました。"}, {"num": 120, "text": "企業の社会貢献活動の一環として行われる、慈善的な寄付やボランティア活動を指す言葉は何か。", "options": {"1": "メセナ", "2": "フィランソロピー", "3": "スポンサーシップ", "4": "コーポレートベンチャリング"}, "answer": 2, "explanation": "フィランソロピーは、企業や個人が行う慈善的な寄付やボランティア活動など、社会貢献活動全般を指す言葉です。"}, {"num": 121, "text": "世界の所得ピラミッドの底辺に位置する、年間所得3,000ドル以下の低所得者層を対象としたビジネスを何というか。", "options": {"1": "ソーシャルビジネス", "2": "BOPビジネス", "3": "フェアトレード", "4": "マイクロファイナンス"}, "answer": 2, "explanation": "BOP（Base of the Pyramid）ビジネスは、世界の所得ピラミッドの底辺に位置する低所得者層を対象としたビジネスで、貧困削減と企業の事業成長の両立を目指します。"}, {"num": 122, "text": "BOPビジネスの特徴として、最も適切なものはどれか。", "options": {"1": "低所得者層に安価な製品を一方的に提供するビジネスモデル。", "2": "低所得者層を消費者、生産者、販売者として巻き込み、相互利益を追求するビジネスモデル。", "3": "先進国の企業が途上国の資源を安価に調達するビジネスモデル。", "4": "政府の補助金に依存したビジネスモデル。"}, "answer": 2, "explanation": "BOPビジネスは、低所得者層を単なる消費者としてだけでなく、生産者や販売者としても巻き込み、現地の人々と共に価値を創造するビジネスモデルです。"}, {"num": 123, "text": "途上国の生産者に公正な対価を支払い、持続可能な取引関係を構築する取り組みを何というか。", "options": {"1": "ダンピング", "2": "フェアトレード", "3": "ODA（政府開発援助）", "4": "自由貿易"}, "answer": 2, "explanation": "フェアトレードは、途上国の生産者に公正な対価を支払い、労働環境の改善や環境保護を促進しながら、持続可能な取引関係を構築する取り組みです。"}, {"num": 124, "text": "フェアトレード認証ラベルが付いた製品を購入することの意義として、最も適切なものはどれか。", "options": {"1": "最も安い価格で製品を購入できる。", "2": "途上国の生産者の生活向上と持続可能な生産を支援できる。", "3": "製品の品質が最も高いことが保証される。", "4": "国産品であることが保証される。"}, "answer": 2, "explanation": "フェアトレード認証製品を購入することで、途上国の生産者に公正な対価が支払われ、生活向上と持続可能な生産の支援につながります。"}, {"num": 125, "text": "社会課題の解決を事業の主な目的とし、ビジネスの手法を用いて持続的に活動する事業体を何というか。", "options": {"1": "NPO（非営利組織）", "2": "ソーシャルエンタープライズ（社会的企業）", "3": "ベンチャーキャピタル", "4": "コングロマリット"}, "answer": 2, "explanation": "ソーシャルエンタープライズは、社会課題の解決を主な目的とし、ビジネスの手法を用いて持続的に活動する事業体です。"}, {"num": 126, "text": "マイクロファイナンスとは何か。最も適切な説明を選びなさい。", "options": {"1": "大企業向けの大口融資。", "2": "貧困層や低所得者層を対象とした小口の金融サービス。", "3": "株式市場での短期売買。", "4": "政府による財政支出。"}, "answer": 2, "explanation": "マイクロファイナンスは、従来の金融サービスにアクセスできない貧困層や低所得者層を対象に、小口の融資、貯蓄、保険などの金融サービスを提供する仕組みです。"}, {"num": 127, "text": "マイクロファイナンスの先駆者として知られ、ノーベル平和賞を受賞した人物は誰か。", "options": {"1": "コフィ・アナン", "2": "ムハマド・ユヌス", "3": "アマルティア・セン", "4": "バン・キムン"}, "answer": 2, "explanation": "バングラデシュのムハマド・ユヌスは、グラミン銀行を設立し、マイクロファイナンスを通じた貧困削減の取り組みで2006年にノーベル平和賞を受賞しました。"}, {"num": 128, "text": "コーポレートガバナンスとは何か。最も適切な説明を選びなさい。", "options": {"1": "企業の社会貢献活動を管理すること。", "2": "企業の経営を監視・統制し、健全な経営を確保するための仕組み。", "3": "企業の製品品質を管理すること。", "4": "企業の従業員を管理すること。"}, "answer": 2, "explanation": "コーポレートガバナンス（企業統治）は、株主や他のステークホルダーの利益を保護し、企業の健全な経営を確保するための監視・統制の仕組みです。"}, {"num": 129, "text": "コーポレートガバナンスにおいて、社外取締役の役割として最も重要なものはどれか。", "options": {"1": "日常的な業務執行を行うこと。", "2": "経営の監視・監督機能を強化し、経営の透明性を高めること。", "3": "従業員の採用面接を行うこと。", "4": "取引先との交渉を行うこと。"}, "answer": 2, "explanation": "社外取締役は、経営陣から独立した立場で経営を監視・監督し、経営の透明性と公正性を高める役割を担います。"}, {"num": 130, "text": "企業の内部通報制度（公益通報者保護制度）の目的として、最も適切なものはどれか。", "options": {"1": "従業員同士の人間関係のトラブルを解決すること。", "2": "企業内の不正行為を早期に発見・是正し、組織の自浄作用を高めること。", "3": "従業員の業績評価を行うこと。", "4": "従業員の給与に関する不満を受け付けること。"}, "answer": 2, "explanation": "内部通報制度は、従業員が企業内の不正行為や法令違反を安全に報告できる仕組みであり、組織の自浄作用を高めることを目的としています。"}, {"num": 131, "text": "企業が地域社会との共生を図るために行う活動として、適切でないものはどれか。", "options": {"1": "地域の雇用創出への貢献", "2": "地域の環境保全活動への参加", "3": "地域住民の意見を無視した工場建設", "4": "地域の教育・文化活動への支援"}, "answer": 3, "explanation": "地域社会との共生には、地域住民との対話と合意形成が不可欠であり、住民の意見を無視した一方的な開発は適切ではありません。"}, {"num": 132, "text": "企業が自社の事業活動によって地域社会に与える負の影響を最小化するために行うべきこととして、最も適切なものはどれか。", "options": {"1": "地域住民との対話を避け、情報を非公開にする。", "2": "環境アセスメント（環境影響評価）を実施し、結果を公開する。", "3": "地域社会からの苦情を無視する。", "4": "事業活動を秘密裏に進める。"}, "answer": 2, "explanation": "環境アセスメントは、事業活動が環境に与える影響を事前に調査・予測・評価し、その結果を公開して地域住民の意見を反映させる手続きです。"}, {"num": 133, "text": "企業が消費者に対して果たすべき責任として、適切でないものはどれか。", "options": {"1": "安全で品質の高い製品・サービスを提供すること。", "2": "製品・サービスに関する正確な情報を提供すること。", "3": "消費者からのクレームや問い合わせに誠実に対応すること。", "4": "製品の欠陥を隠蔽し、リコールを回避すること。"}, "answer": 4, "explanation": "製品の欠陥を隠蔽することは消費者の安全を脅かす重大な問題であり、企業の社会的責任に反する行為です。"}, {"num": 134, "text": "企業のサプライチェーンマネジメントにおいて、CSRの観点から重要視されることとして、適切でないものはどれか。", "options": {"1": "サプライヤーの労働環境の改善", "2": "サプライヤーの環境負荷の低減", "3": "サプライヤーに対する一方的なコスト削減要求", "4": "サプライヤーの人権尊重の確認"}, "answer": 3, "explanation": "一方的なコスト削減要求は、サプライヤーの労働環境悪化や品質低下を招く恐れがあり、CSRの観点からは適切ではありません。"}, {"num": 135, "text": "企業がサプライヤーに対してCSR調達基準を設定し、遵守を求めることの意義として、最も適切なものはどれか。", "options": {"1": "サプライヤーの経営に介入し、支配すること。", "2": "サプライチェーン全体でのリスク管理と、社会的・環境的責任の遂行を確保すること。", "3": "サプライヤーの数を減らし、調達コストを削減すること。", "4": "サプライヤーとの取引関係を短期的にすること。"}, "answer": 2, "explanation": "CSR調達基準の設定は、サプライチェーン全体での人権・環境リスクを管理し、責任ある調達を実現するための重要な取り組みです。"}, {"num": 136, "text": "企業が投資家に対して果たすべき責任として、最も適切なものはどれか。", "options": {"1": "常に株価を上昇させること。", "2": "正確かつ適時な情報開示を行い、企業価値の持続的な向上に努めること。", "3": "投資家の要求をすべて受け入れること。", "4": "配当金を毎年増額すること。"}, "answer": 2, "explanation": "投資家に対する責任は、正確で適時な情報開示と、中長期的な企業価値の向上に努めることです。"}, {"num": 137, "text": "企業が従業員に対して果たすべき責任として、適切でないものはどれか。", "options": {"1": "安全で健康的な労働環境を提供すること。", "2": "公正な賃金と福利厚生を提供すること。", "3": "キャリア開発の機会を提供すること。", "4": "過度な長時間労働を強いること。"}, "answer": 4, "explanation": "過度な長時間労働は従業員の健康を害し、労働基準法にも違反する可能性があり、企業が従業員に対して果たすべき責任に反します。"}, {"num": 138, "text": "企業が政府・行政に対して果たすべき責任として、最も適切なものはどれか。", "options": {"1": "政治家への不正な献金を行うこと。", "2": "法令を遵守し、適正な納税を行うこと。", "3": "規制の緩和を一方的に要求すること。", "4": "行政の監査を妨害すること。"}, "answer": 2, "explanation": "企業が政府・行政に対して果たすべき基本的な責任は、法令遵守と適正な納税です。"}, {"num": 139, "text": "企業がNGO/NPOとの対話を通じて得られるメリットとして、適切でないものはどれか。", "options": {"1": "社会課題に関する専門的な知見を得ることができる。", "2": "企業の社会的責任に関する外部からの視点を取り入れることができる。", "3": "NGO/NPOのネットワークを活用し、社会貢献活動の効果を高めることができる。", "4": "NGO/NPOの活動を完全にコントロールし、自社に都合の良い情報のみを発信させることができる。"}, "answer": 4, "explanation": "NGO/NPOとの連携は対等なパートナーシップに基づくべきであり、企業が一方的にコントロールすることは適切ではありません。"}, {"num": 140, "text": "企業のレピュテーション（評判）リスクとは何か。最も適切な説明を選びなさい。", "options": {"1": "企業の製品が競合他社よりも評価が低いリスク。", "2": "不祥事や不適切な行動によって企業の社会的評価が低下し、事業に悪影響を及ぼすリスク。", "3": "企業の株価が下落するリスク。", "4": "企業の従業員が退職するリスク。"}, "answer": 2, "explanation": "レピュテーションリスクは、企業の不祥事や不適切な行動が報道やSNSで拡散され、社会的評価が低下することで事業に悪影響を及ぼすリスクです。"}, {"num": 141, "text": "企業がレピュテーションリスクを管理するために重要なこととして、適切でないものはどれか。", "options": {"1": "危機管理体制の整備", "2": "ステークホルダーとの日常的なコミュニケーション", "3": "不祥事が発生した場合の迅速かつ誠実な対応", "4": "問題が発生しても情報を隠蔽し、外部に漏れないようにすること"}, "answer": 4, "explanation": "情報の隠蔽は、問題が発覚した際にさらに大きなレピュテーションダメージを招く原因となります。"}, {"num": 142, "text": "企業が「ソーシャル・ライセンス」を維持するために最も重要なことは何か。", "options": {"1": "政府からの営業許可を取得すること。", "2": "地域社会やステークホルダーからの信頼と支持を継続的に得ること。", "3": "業界団体に加盟すること。", "4": "大量の広告を出稿すること。"}, "answer": 2, "explanation": "ソーシャル・ライセンスは法的な許認可とは異なり、地域社会やステークホルダーからの信頼と支持に基づく、事業活動の社会的な正当性です。"}, {"num": 143, "text": "企業のCSR活動において、「戦略的CSR」とはどのような考え方か。", "options": {"1": "CSR活動を広報戦略の一環として位置づけること。", "2": "自社の事業戦略とCSR活動を統合し、社会課題の解決と事業成長の両立を目指すこと。", "3": "CSR活動にかかるコストを最小化すること。", "4": "競合他社のCSR活動を模倣すること。"}, "answer": 2, "explanation": "戦略的CSRは、CSRを単なる社会貢献活動ではなく、事業戦略の中核に位置づけ、社会的価値と経済的価値の同時創造を目指す考え方です。"}, {"num": 144, "text": "企業が自社のバリューチェーン（価値連鎖）を分析し、各段階における社会的・環境的影響を把握することの意義として、最も適切なものはどれか。", "options": {"1": "コスト削減の機会を見つけること。", "2": "自社の事業活動がステークホルダーや環境に与える影響を体系的に理解し、改善策を講じること。", "3": "競合他社のバリューチェーンを把握すること。", "4": "新製品の開発アイデアを得ること。"}, "answer": 2, "explanation": "バリューチェーン分析により、原材料調達から製品の廃棄に至るまでの各段階における社会的・環境的影響を体系的に把握し、改善策を講じることができます。"}, {"num": 145, "text": "企業が「統合報告書」を発行する目的として、最も適切なものはどれか。", "options": {"1": "法律で義務付けられているため。", "2": "財務情報と非財務情報（ESG情報）を関連付けて報告し、企業価値の全体像をステークホルダーに伝えること。", "3": "CSR報告書の代わりとして、コスト削減のため。", "4": "投資家向けの広告として。"}, "answer": 2, "explanation": "統合報告書は、財務情報と非財務情報を統合的に報告することで、企業の中長期的な価値創造の全体像をステークホルダーに伝えることを目的としています。"}, {"num": 146, "text": "企業が「人的資本」の開示を求められる背景として、最も適切なものはどれか。", "options": {"1": "従業員の個人情報を公開する義務があるため。", "2": "人材が企業の持続的な価値創造の源泉であり、投資家がその情報を重視するようになったため。", "3": "従業員数が多い企業ほど優れているとされるため。", "4": "政府が人件費の削減を求めているため。"}, "answer": 2, "explanation": "人的資本は企業の競争力と持続的な価値創造の源泉であり、投資家がESG投資の一環として人的資本情報を重視するようになったことが背景にあります。"}, {"num": 147, "text": "企業のサステナビリティ経営において、「長期的視点」が重要とされる理由として、最も適切なものはどれか。", "options": {"1": "短期的な利益を追求する方が株主に好まれるため。", "2": "環境問題や社会課題は短期間では解決できず、持続的な取り組みが必要であるため。", "3": "長期的な計画を立てることで、従業員の労働時間を削減できるため。", "4": "長期的な視点を持つことで、競合他社の動向を予測できるため。"}, "answer": 2, "explanation": "気候変動や生物多様性の損失、社会的不平等などの課題は、短期間では解決できない構造的な問題であり、長期的な視点での取り組みが不可欠です。"}, {"num": 148, "text": "企業が「ネットゼロ」を宣言することの意味として、最も適切なものはどれか。", "options": {"1": "インターネットの使用をゼロにすること。", "2": "温室効果ガスの排出量を削減し、残りの排出量を吸収・除去することで、排出量を実質ゼロにすること。", "3": "純利益をゼロにすること。", "4": "従業員の残業時間をゼロにすること。"}, "answer": 2, "explanation": "ネットゼロは、まず排出量を可能な限り削減した上で、残りの排出量を炭素吸収・除去によって相殺し、実質的にゼロにすることを意味します。"}, {"num": 149, "text": "企業が「ネイチャーポジティブ」を目指すとは、どのようなことを意味するか。", "options": {"1": "自然環境への影響をゼロにすること。", "2": "自然環境の損失を止め、回復に向かわせること。", "3": "自然エネルギーのみを使用すること。", "4": "自然食品のみを製造すること。"}, "answer": 2, "explanation": "ネイチャーポジティブは、2030年までに自然の損失を止め、回復の軌道に乗せることを目指す概念で、生物多様性の保全と回復を重視しています。"}, {"num": 150, "text": "企業が「TNFD（自然関連財務情報開示タスクフォース）」に基づく情報開示を行う目的として、最も適切なものはどれか。", "options": {"1": "自然環境に関する学術研究を発表すること。", "2": "自然関連のリスクと機会を特定・評価し、投資家やステークホルダーに開示すること。", "3": "自然保護区の管理を行うこと。", "4": "自然災害の予測を行うこと。"}, "answer": 2, "explanation": "TNFDは、TCFDの自然版として、企業が自然関連のリスクと機会を特定・評価し、財務情報として開示するための枠組みを提供しています。"}, {"num": 151, "text": "企業が「ウェルビーイング経営」を推進する目的として、最も適切なものはどれか。", "options": {"1": "従業員の給与を最大化すること。", "2": "従業員の身体的・精神的・社会的な健康と幸福を実現し、生産性と創造性を高めること。", "3": "従業員の労働時間を最大化すること。", "4": "従業員の転職を防止すること。"}, "answer": 2, "explanation": "ウェルビーイング経営は、従業員の総合的な幸福（身体的・精神的・社会的健康）を重視し、それによって組織全体の生産性と創造性を高めることを目指します。"}, {"num": 152, "text": "企業が「健康経営」に取り組むことのメリットとして、適切でないものはどれか。", "options": {"1": "従業員の生産性向上", "2": "医療費の適正化", "3": "企業イメージの向上", "4": "従業員のプライバシーの侵害"}, "answer": 4, "explanation": "健康経営は従業員の健康増進を目的としますが、プライバシーの侵害はメリットではなく、むしろ注意すべきリスクです。"}, {"num": 153, "text": "企業が「エシカル消費」を推進することの意義として、最も適切なものはどれか。", "options": {"1": "最も安い製品を消費者に提供すること。", "2": "消費者が環境や社会に配慮した製品・サービスを選択することを促し、持続可能な社会の実現に貢献すること。", "3": "高級品の販売を促進すること。", "4": "消費者の購買意欲を抑制すること。"}, "answer": 2, "explanation": "エシカル消費は、消費者が購買行動を通じて環境や社会に配慮した選択を行うことで、持続可能な社会の実現に貢献する消費行動です。"}, {"num": 154, "text": "企業が「グリーンウォッシュ」を行うことのリスクとして、最も適切なものはどれか。", "options": {"1": "環境に配慮した製品の売上が増加するリスク。", "2": "消費者や投資家からの信頼を失い、企業の評判が損なわれるリスク。", "3": "環境規制が緩和されるリスク。", "4": "従業員のモチベーションが向上するリスク。"}, "answer": 2, "explanation": "グリーンウォッシュ（環境に配慮しているように見せかけること）が発覚すると、消費者や投資家からの信頼を失い、深刻なレピュテーションダメージを受けるリスクがあります。"}, {"num": 155, "text": "企業が「人権方針」を策定し公表することの意義として、最も適切なものはどれか。", "options": {"1": "法律で義務付けられているため、罰則を回避すること。", "2": "企業として人権を尊重する姿勢を明確にし、ステークホルダーに対するコミットメントを示すこと。", "3": "人権問題に関する訴訟を回避すること。", "4": "人権に関する社内研修を省略すること。"}, "answer": 2, "explanation": "人権方針の策定・公表は、企業が人権尊重の姿勢を内外に示し、ステークホルダーに対する責任あるコミットメントを表明する重要な取り組みです。"}, {"num": 156, "text": "企業が「サプライチェーン・デュー・ディリジェンス」を実施する目的として、最も適切なものはどれか。", "options": {"1": "サプライヤーの財務状況のみを確認すること。", "2": "サプライチェーン全体における人権・環境リスクを特定・評価し、防止・軽減策を講じること。", "3": "サプライヤーの数を削減すること。", "4": "サプライヤーとの価格交渉を有利に進めること。"}, "answer": 2, "explanation": "サプライチェーン・デュー・ディリジェンスは、サプライチェーン全体の人権・環境リスクを特定・評価し、予防・軽減措置を講じるプロセスです。"}, {"num": 157, "text": "企業が「ステークホルダー・ダイアログ」を開催する際に重要なこととして、適切でないものはどれか。", "options": {"1": "多様なステークホルダーの参加を促すこと。", "2": "参加者の意見を真摯に受け止め、経営に反映させること。", "3": "企業にとって都合の良い意見のみを採用すること。", "4": "対話の結果を公開し、透明性を確保すること。"}, "answer": 3, "explanation": "ステークホルダー・ダイアログでは、企業にとって耳の痛い意見も含めて真摯に受け止め、経営に反映させることが重要です。"}, {"num": 158, "text": "企業が「マテリアリティ・マトリックス」を作成する目的として、最も適切なものはどれか。", "options": {"1": "企業の財務データを視覚化すること。", "2": "ステークホルダーにとっての重要性と自社にとっての重要性の2軸で、優先的に取り組むべき課題を特定すること。", "3": "競合他社の戦略を分析すること。", "4": "従業員の業績評価を行うこと。"}, "answer": 2, "explanation": "マテリアリティ・マトリックスは、2軸のマトリックスを用いて重要課題を視覚的に整理し、優先順位を明確にするツールです。"}, {"num": 159, "text": "企業が社会貢献活動を行う際に、NPO/NGOと連携するメリットとして、適切でないものはどれか。", "options": {"1": "NPO/NGOが持つ専門性や現場の知見を活用できる。", "2": "企業の従業員が社会課題への理解を深める機会となる。", "3": "NPO/NGOの信頼性やネットワークを活用できる。", "4": "企業の意向を一方的に押し付け、活動を完全にコントロールできる。"}, "answer": 4, "explanation": "NPO/NGOとの連携は対等なパートナーシップに基づくべきであり、企業が一方的に活動をコントロールすることは適切ではありません。"}, {"num": 160, "text": "企業が寄付を行う際に、寄付先の団体が信頼できるかどうかを判断する基準として、適切なものはどれか。", "options": {"1": "団体の設立年数が長いこと。", "2": "団体の代表者が有名人であること。", "3": "団体の活動内容や財務情報が透明性をもって公開されていること。", "4": "団体の事務所が都心の一等地にあること。"}, "answer": 3, "explanation": "寄付先の信頼性を判断する際は、活動内容、財務情報、ガバナンス体制などが透明性をもって公開されているかどうかが重要な基準となります。"}]}, {"id": 4, "title": "第4章 働き方・ダイバーシティ・NPO/NGO", "questions": [{"num": 161, "text": "仕事と生活の調和を意味し、従業員が健康で豊かな生活を送りながら、仕事上の責任も果たせる状態を目指す考え方を何というか。", "options": {"1": "ワーク・ライフ・バランス", "2": "フレックスタイム制度", "3": "テレワーク", "4": "ジョブ・シェアリング"}, "answer": 1, "explanation": "ワーク・ライフ・バランスは、仕事と生活の調和を意味し、従業員が健康で豊かな生活を送りながら、仕事上の責任も果たせる状態を目指す考え方です。"}, {"num": 162, "text": "組織内に多様な人材（性別、年齢、国籍、価値観など）を受け入れ、その多様性を活かすことで組織の競争力を高めようとする考え方を何というか。", "options": {"1": "ダイバーシティ＆インクルージョン", "2": "グローバル化", "3": "年功序列", "4": "終身雇用"}, "answer": 1, "explanation": "ダイバーシティ＆インクルージョン（D&I）は、多様な人材を受け入れ（ダイバーシティ）、その多様性を活かして組織の力とする（インクルージョン）考え方です。"}, {"num": 163, "text": "ダイバーシティ＆インクルージョンに「エクイティ（Equity）」を加えた「DEI」という考え方が注目されている。この「エクイティ」が意味するものは何か。", "options": {"1": "すべての人を平等に扱うこと。", "2": "個々の状況やニーズの違いを考慮し、公平な機会を提供すること。", "3": "従業員の満足度を高めること。", "4": "組織の利益を最大化すること。"}, "answer": 2, "explanation": "エクイティ（公平性）は、平等（Equality）とは異なり、個々人の状況やニーズの違いを考慮して、全員が同じスタートラインに立てるよう公平な機会を提供する考え方です。"}, {"num": 164, "text": "日本の「障害者雇用促進法」において、民間企業に義務付けられている法定雇用率（2024年4月時点）として正しいものはどれか。", "options": {"1": "1.8%", "2": "2.0%", "3": "2.5%", "4": "3.0%"}, "answer": 3, "explanation": "2024年4月から民間企業の法定雇用率は2.5%に引き上げられました（従来は\n2.3%）。"}, {"num": 165, "text": "性的指向（Sexual Orientation）と性自認（Gender Identity）の頭文字をとった、性的マイノリティに関する総称の一つは何か。", "options": {"1": "LGBT", "2": "SOGI", "3": "DEI", "4": "B Corp"}, "answer": 2, "explanation": "SOGI（ソジ）はSexual Orientation（性的指向）とGender Identity（性自認）の頭文字をとった用語で、すべての人が持つ属性として捉えられています。LGBTは特定の性的マイノリティの総称です。"}, {"num": 166, "text": "利益を目的とせず、社会的な課題解決のために活動する民間の非営利組織を何というか。", "options": {"1": "NPO（特定非営利活動法人）", "2": "株式会社", "3": "労働組合", "4": "財団法人"}, "answer": 1, "explanation": "NPO（Non-Proﬁt Organization）は、利益を目的とせず、社会的な課題解決のために活動する民間の非営利組織です。"}, {"num": 167, "text": "国境を越えて地球規模の課題解決に取り組む非政府組織を何というか。", "options": {"1": "NGO（非政府組織）", "2": "ODA（政府開発援助）", "3": "WTO（世界貿易機関）", "4": "WHO（世界保健機関）"}, "answer": 1, "explanation": "NGO（Non-Governmental Organization）は、政府から独立した立場で、国境を越えて地球規模の課題（環境、人権、開発など）に取り組む非政府組織です。"}, {"num": 168, "text": "企業がNPO/NGOと連携（協働）する際のメリットとして、最も適切なものはどれか。", "options": {"1": "NPO/NGOの専門性やネットワークを活用し、社会課題解決への貢献度を高めることができる。", "2": "企業のブランドイメージを短期的に向上させることのみが目的である。", "3": "NPO/NGOの活動資金をすべて企業が負担する義務が生じる。", "4": "企業の利益活動を直接的に支援してもらうことができる。"}, "answer": 1, "explanation": "NPO/NGOは特定の社会課題に関する専門的な知見や現場のネットワークを持っており、企業との連携により、より効果的な社会課題解決が可能になります。"}, {"num": 169, "text": "貧困、環境問題などの社会課題を、ビジネスの手法を用いて解決しようとする事業を何というか。", "options": {"1": "ソーシャルビジネス", "2": "フランチャイズビジネス", "3": "ニッチビジネス", "4": "BtoBビジネス"}, "answer": 1, "explanation": "ソーシャルビジネスは、貧困、環境問題、高齢化など社会課題の解決を目的とし、ビジネスの手法を用いて持続的に活動する事業です。"}, {"num": 170, "text": "消費者が商品やサービスを購入する際に、価格や品質だけでなく、その背景にある環境や社会への影響を考慮して選択する行動を何というか。", "options": {"1": "衝動買い", "2": "倫理的消費（エシカル消費）", "3": "ブランド志向", "4": "大量消費"}, "answer": 2, "explanation": "エシカル消費は、消費者が価格や品質だけでなく、環境負荷、人権、地域社会への影響などを考慮して商品・サービスを選択する消費行動です。"}, {"num": 171, "text": "日本の「女性活躍推進法」の目的として、最も適切なものはどれか。", "options": {"1": "女性の就業率を100%にすること。", "2": "女性が職業生活において、その希望に応じて十分に能力を発揮し、活躍できる環境を整備すること。", "3": "女性の管理職比率を男性と同数にすること。", "4": "女性専用の職場を設けること。"}, "answer": 2, "explanation": "女性活躍推進法は、女性の個性と能力が十分に発揮できる社会の実現を目指し、事業主に行動計画の策定・公表を義務付けています。"}, {"num": 172, "text": "日本において、男性の育児休業取得を促進するために2022年に施行された法律は何か。", "options": {"1": "育児・介護休業法の改正（産後パパ育休制度の創設）", "2": "男女雇用機会均等法", "3": "労働基準法", "4": "次世代育成支援対策推進法"}, "answer": 1, "explanation": "2022年10月に施行された改正育児・介護休業法により、「産後パパ育休（出生時育児休業）」制度が創設され、男性の育児休業取得が促進されています。"}, {"num": 173, "text": "「同一労働同一賃金」の原則が意味するものとして、最も適切なものはどれか。", "options": {"1": "すべての従業員に同じ給与を支払うこと。", "2": "同じ仕事内容であれば、雇用形態（正規・非正規）にかかわらず、不合理な待遇差を設けないこと。", "3": "年功序列に基づいて賃金を決定すること。", "4": "業績に応じて賃金を変動させること。"}, "answer": 2, "explanation": "同一労働同一賃金は、正規雇用と非正規雇用の間の不合理な待遇差を解消し、どのような雇用形態でも公正な待遇を確保することを目指す原則です。"}, {"num": 174, "text": "企業がハラスメント防止に取り組むことの意義として、適切でないものはどれか。", "options": {"1": "従業員の心身の健康を守ること。", "2": "職場の生産性を向上させること。", "3": "企業の法的リスクを軽減すること。", "4": "加害者を厳罰に処することのみが目的であること。"}, "answer": 4, "explanation": "ハラスメント防止の目的は、加害者の厳罰だけでなく、予防・教育・相談体制の整備を通じて、すべての従業員が安心して働ける職場環境を実現することです。"}, {"num": 175, "text": "パワーハラスメントの定義に含まれる3つの要素として、正しい組み合わせはどれか。", "options": {"1": "優越的な関係を背景とした言動、業務上必要かつ相当な範囲を超えたもの、労働者の就業環境が害されるもの", "2": "上司からの指示、業務上の命令、労働者の能力不足", "3": "同僚間の競争、業績評価、昇進の可否", "4": "顧客からのクレーム、取引先からの要求、株主からの質問"}, "answer": 1, "explanation": "パワーハラスメントは、この3つの要素をすべて満たすものと定義されています（労働施策総合推進法）。"}, {"num": 176, "text": "企業が「健康経営」に取り組む目的として、最も適切なものはどれか。", "options": {"1": "従業員の医療費を企業が全額負担すること。", "2": "従業員の健康管理を経営的な視点から考え、戦略的に実践することで、企業の生産性向上や組織の活性化を図ること。", "3": "従業員に健康診断を受けさせる法的義務を果たすこと。", "4": "従業員のプライベートな生活習慣を管理すること。"}, "answer": 2, "explanation": "健康経営は、従業員の健康を経営資源と捉え、戦略的に健康増進に取り組むことで、生産性向上、医療費適正化、企業イメージ向上などの効果を目指します。"}, {"num": 177, "text": "「心理的安全性」が高い職場の特徴として、最も適切なものはどれか。", "options": {"1": "従業員が自分の意見やアイデアを自由に発言でき、失敗を恐れずに挑戦できる環境。", "2": "従業員同士の競争が激しく、常に緊張感がある環境。", "3": "上司の指示に従うことが最も重視される環境。", "4": "従業員が個人で仕事を完結し、チームワークが不要な環境。"}, "answer": 1, "explanation": "心理的安全性（Psychological Safety）は、ハーバード大学のエイミー・エドモンドソン教授が提唱した概念で、チーム内で自分の意見を述べても否定されたり罰せられたりしないと感じられる状態を指します。"}, {"num": 178, "text": "企業が「人的資本経営」を実践するとは、どのようなことを意味するか。", "options": {"1": "人件費を最小限に抑えること。", "2": "人材を「資本」として捉え、その価値を最大限に引き出すことで、中長期的な企業価値向上につなげること。", "3": "従業員の数を増やすこと。", "4": "人事部門の権限を強化すること。"}, "answer": 2, "explanation": "人的資本経営は、人材を「コスト」ではなく「資本」として捉え、教育・研修、健康管理、エンゲージメント向上などへの投資を通じて、企業価値の持続的な向上を目指す経営手法です。"}, {"num": 179, "text": "日本政府が推進する「働き方改革」の主な目的として、適切でないものはどれか。", "options": {"1": "長時間労働の是正", "2": "非正規雇用の処遇改善", "3": "柔軟な働き方の実現", "4": "従業員の転職を制限すること"}, "answer": 4, "explanation": "働き方改革は、長時間労働の是正、非正規雇用の処遇改善、柔軟な働き方の実現を主な目的としており、従業員の転職を制限することは含まれません。"}, {"num": 180, "text": "テレワーク（リモートワーク）の導入によって期待される効果として、適切でないものはどれか。", "options": {"1": "通勤時間の削減による従業員のワーク・ライフ・バランスの向上", "2": "オフィスコストの削減", "3": "地方在住者や障害者など、多様な人材の活用", "4": "従業員間のコミュニケーションが必ず向上すること"}, "answer": 4, "explanation": "テレワークには多くのメリットがありますが、対面でのコミュニケーション機会の減少により、むしろコミュニケーションの課題が生じることもあります。"}, {"num": 181, "text": "企業が「エンゲージメント・サーベイ」を実施する目的として、最も適切なものはどれか。", "options": {"1": "従業員の出勤率を管理すること。", "2": "従業員の仕事への熱意や組織への愛着度を測定し、組織の課題を把握すること。", "3": "従業員の給与水準を決定すること。", "4": "従業員の退職を防止するための監視を行うこと。"}, "answer": 2, "explanation": "エンゲージメント・サーベイは、従業員の仕事への熱意（エンゲージメント）を定量的に測定し、組織の課題を把握して改善につなげるための調査です。"}, {"num": 182, "text": "「アンコンシャス・バイアス（無意識の偏見）」が組織に与える影響として、適切でないものはどれか。", "options": {"1": "採用や昇進において、特定の属性を持つ人が不利になる可能性がある。", "2": "多様な意見やアイデアが抑制される可能性がある。", "3": "組織の意思決定の質が低下する可能性がある。", "4": "組織の多様性が自動的に向上する。"}, "answer": 4, "explanation": "アンコンシャス・バイアスは、むしろ組織の多様性を阻害する要因となります。無意識の偏見により、特定の属性を持つ人が不利になったり、多様な意見が抑制されたりする可能性があります。"}, {"num": 183, "text": "企業が「インクルーシブな職場」を実現するために重要なこととして、適切でないものはどれか。", "options": {"1": "多様な背景を持つ従業員が、自分の意見を安心して表明できる環境を整えること。", "2": "すべての従業員が公平に能力を発揮できる機会を提供すること。", "3": "特定のグループの従業員のみを優遇すること。", "4": "多様性に関する研修や教育を実施すること。"}, "answer": 3, "explanation": "インクルーシブな職場は、すべての従業員が公平に扱われ、能力を発揮できる環境を目指すものであり、特定のグループのみを優遇することは適切ではありません。"}, {"num": 184, "text": "ILO（国際労働機関）が定める「中核的労働基準」に含まれないものはどれか。", "options": {"1": "結社の自由と団体交渉権の承認", "2": "強制労働の禁止", "3": "児童労働の撤廃", "4": "最低賃金の統一"}, "answer": 4, "explanation": "ILOの中核的労働基準は、結社の自由と団体交渉権、強制労働の禁止、児童労働の撤廃、雇用・職業における差別の排除の4分野8条約です。最低賃金の統一は含まれません。"}, {"num": 185, "text": "「ディーセント・ワーク」とは何か。最も適切な説明を選びなさい。", "options": {"1": "高収入が得られる仕事。", "2": "権利が保障され、十分な収入を生み出し、適切な社会的保護が与えられる生産的な仕事。", "3": "デスクワーク中心の仕事。", "4": "残業のない仕事。"}, "answer": 2, "explanation": "ディーセント・ワーク（働きがいのある人間らしい仕事）は、ILOが提唱する概念で、SDGsの目標8にも掲げられています。"}, {"num": 186, "text": "企業が「児童労働」の撲滅に取り組むべき理由として、最も適切なものはどれか。", "options": {"1": "児童労働は生産効率が低いため。", "2": "児童の教育を受ける権利や健全な発達を阻害する深刻な人権侵害であるため。", "3": "児童労働は先進国でのみ問題となっているため。", "4": "児童労働に関する国際的な規制が存在しないため。"}, "answer": 2, "explanation": "児童労働は、子どもの教育機会を奪い、心身の健全な発達を阻害する深刻な人権侵害であり、ILOの中核的労働基準でも撤廃が求められています。"}, {"num": 187, "text": "企業が「強制労働」を防止するために行うべきこととして、適切でないものはどれか。", "options": {"1": "サプライチェーンにおける労働条件の監査を実施すること。", "2": "労働者のパスポートや身分証明書を取り上げること。", "3": "労働者が自由に退職できる環境を確保すること。", "4": "強制労働に関する方針を策定し、サプライヤーに周知すること。"}, "answer": 2, "explanation": "パスポートや身分証明書の取り上げは、労働者の移動の自由を制限する強制労働の典型的な手口であり、絶対に行ってはならない行為です。"}, {"num": 188, "text": "企業が「生活賃金（リビングウェイジ）」を支払うことの意義として、最も適切なものはどれか。", "options": {"1": "法定最低賃金を支払えば十分であるため、生活賃金は不要である。", "2": "労働者とその家族が、基本的なニーズ（食料、住居、教育、医療など）を満たせる水準の賃金を保障すること。", "3": "すべての従業員に同額の賃金を支払うこと。", "4": "賃金を毎年自動的に引き上げること。"}, "answer": 2, "explanation": "生活賃金は、法定最低賃金とは異なり、労働者とその家族が人間らしい生活を送るために必要な水準の賃金を指します。"}, {"num": 189, "text": "NPO法人の特徴として、正しいものはどれか。", "options": {"1": "利益を上げてはならない。", "2": "利益を上げることは可能だが、構成員に分配してはならない。", "3": "株式を発行して資金を調達する。", "4": "政府の下部組織である。"}, "answer": 2, "explanation": "NPO法人は事業活動で利益を上げることは可能ですが、その利益を構成員（社員や役員）に分配することはできず、次の活動に充てなければなりません。"}, {"num": 190, "text": "日本のNPO法（特定非営利活動促進法）が定める特定非営利活動の分野数はいくつか。", "options": {"1": "10分野", "2": "15分野", "3": "20分野", "4": "25分野"}, "answer": 3, "explanation": "NPO法（特定非営利活動促進法）では、保健・医療・福祉、社会教育、まちづくりなど20の分野が特定非営利活動として定められています。"}, {"num": 191, "text": "企業がNPO/NGOとの連携において、「セクターを超えた協働（クロスセクター・パートナーシップ）」が重要とされる理由として、最も適切なものはどれか。", "options": {"1": "一つのセクターだけでは解決が困難な複雑な社会課題に対して、異なるセクターの強みを組み合わせることで、より効果的な解決策を生み出せるため。", "2": "企業がNPO/NGOを支配するため。", "3": "政府の役割を民間に移管するため。", "4": "NPO/NGOの活動を企業の利益に直結させるため。"}, "answer": 1, "explanation": "企業（ビジネスセクター）、NPO/NGO（市民セクター）、政府（公共セクター）がそれぞれの強みを持ち寄ることで、複雑な社会課題に対してより効果的に取り組むことができます。"}, {"num": 192, "text": "企業の社会貢献活動の形態として、「コーズ・リレーテッド・マーケティング」とは何か。", "options": {"1": "社会課題に関する啓発キャンペーンを行うこと。", "2": "特定の商品・サービスの売上の一部を社会貢献団体に寄付する仕組み。", "3": "従業員がボランティア活動に参加すること。", "4": "企業が直接的に社会課題の解決に取り組むこと。"}, "answer": 2, "explanation": "コーズ・リレーテッド・マーケティング（CRM）は、商品の売上の一部を特定の社会的大義（コーズ）に寄付する仕組みで、消費者の購買行動を通じた社会貢献を促進します。"}, {"num": 193, "text": "企業の社会貢献活動において、「プロボノ」とは何か。", "options": {"1": "企業が金銭的な寄付を行うこと。", "2": "従業員が自分の専門知識やスキルを活かして行うボランティア活動。", "3": "企業が製品を無償で提供すること。", "4": "企業がNPO/NGOの運営を代行すること。"}, "answer": 2, "explanation": "プロボノ（Pro bono）は、ラテン語の「公共善のために」に由来し、専門家が自分の知識やスキルを無償で提供して行う社会貢献活動です。"}, {"num": 194, "text": "企業が「メセナ活動」として行うものは何か。", "options": {"1": "環境保全活動", "2": "文化・芸術活動への支援", "3": "災害復興支援", "4": "教育支援"}, "answer": 2, "explanation": "メセナは、企業が行う文化・芸術活動への支援を指すフランス語由来の言葉です。日本では公益社団法人企業メセナ協議会が活動を推進しています。"}, {"num": 195, "text": "企業の社会貢献活動を評価する際に、「SROI（社会的投資収益率）」が用いられることがある。SROIとは何か。", "options": {"1": "企業の財務的な投資収益率。", "2": "社会貢献活動への投資に対して、どれだけの社会的価値が創出されたかを金銭的に換算して評価する指標。", "3": "従業員の満足度を測る指標。", "4": "企業の株価パフォーマンスを測る指標。"}, "answer": 2, "explanation": "SROI（Social Return on Investment）は、社会的投資収益率とも呼ばれ、社会貢献活動の成果を金銭的に換算して、投資対効果を評価する手法です。"}, {"num": 196, "text": "企業が「マッチングギフト」制度を導入する目的として、最も適切なものはどれか。", "options": {"1": "従業員の給与を増額すること。", "2": "従業員の寄付に対して企業が同額（または一定割合）を上乗せして寄付し、社会貢献を促進すること。", "3": "企業の税負担を軽減すること。", "4": "取引先との関係を強化すること。"}, "answer": 2, "explanation": "マッチングギフトは、従業員の自発的な寄付に対して企業が同額（または一定割合）を上乗せして寄付する制度で、従業員の社会貢献意識を高める効果があります。"}, {"num": 197, "text": "「ソーシャル・イノベーション」とは何か。最も適切な説明を選びなさい。", "options": {"1": "IT技術を活用した新しいビジネスモデルの創出。", "2": "社会課題を解決するための革新的なアイデア、製品、サービス、仕組みの創出。", "3": "企業の組織構造を革新すること。", "4": "新しいSNSプラットフォームの開発。"}, "answer": 2, "explanation": "ソーシャル・イノベーションは、社会課題の解決に向けた革新的なアプローチであり、新しい製品・サービス・ビジネスモデル・制度などの創出を含みます。"}, {"num": 198, "text": "「B Corp認証」とは何か。最も適切な説明を選びなさい。", "options": {"1": "大企業のみが取得できる品質認証。", "2": "社会的・環境的パフォーマンス、透明性、法的説明責任において高い基準を満たした企業に与えられる認証。", "3": "環境マネジメントシステムに関する国際認証。", "4": "有機農産物に関する認証。"}, "answer": 2, "explanation": "B Corp認証は、米国の非営利団体B Labが運営する認証制度で、社会的・環境的パフォーマンス、透明性、法的説明責任の高い基準を満たした企業に付与されます。"}, {"num": 199, "text": "企業が「インパクト測定・マネジメント（IMM）」を行う目的として、最も適切なものはどれか。", "options": {"1": "企業の財務パフォーマンスのみを測定すること。", "2": "事業活動が社会・環境に与えるポジティブ・ネガティブ両方の影響を測定・管理し、意思決定に活用すること。", "3": "従業員の業績評価を行うこと。", "4": "競合他社の市場シェアを測定すること。"}, "answer": 2, "explanation": "インパクト測定・マネジメント（IMM）は、事業活動の社会的・環境的インパクトを定量的・定性的に測定し、経営の意思決定に活用するプロセスです。"}, {"num": 200, "text": "企業が「サステナビリティ委員会」を設置する目的として、最も適切なものはどれか。", "options": {"1": "環境問題のみを議論すること。", "2": "サステナビリティに関する経営戦略の策定・推進を、取締役会レベルで監督・推進すること。", "3": "CSR報告書の作成のみを担当すること。", "4": "従業員のボランティア活動を管理すること。"}, "answer": 2, "explanation": "サステナビリティ委員会は、取締役会の下部組織として設置され、サステナビリティに関する方針・戦略の策定、目標の設定・進捗管理などを行います。"}, {"num": 201, "text": "企業が従業員の社会貢献活動を支援する制度として、「ボランティア休暇制度」がある。この制度の目的として、最も適切なものはどれか。", "options": {"1": "従業員の有給休暇を削減すること。", "2": "従業員がボランティア活動に参加しやすい環境を整え、社会貢献意識を高めること。", "3": "従業員の労働時間を管理すること。", "4": "企業の人件費を削減すること。"}, "answer": 2, "explanation": "ボランティア休暇制度は、有給休暇とは別に、従業員がボランティア活動に参加するための休暇を付与する制度です。"}, {"num": 202, "text": "企業がコーズ・リレーテッド・マーケティングを実施する際の留意点として、適切でないものはどれか。", "options": {"1": "支援先の活動内容と自社の事業との関連性を考慮すること。", "2": "寄付金額や支援の成果を透明性をもって公開すること。", "3": "消費者の善意を利用して、自社の利益のみを追求すること。", "4": "消費者が支援に参加しやすい仕組みを設計すること。"}, "answer": 3, "explanation": "コーズ・リレーテッド・マーケティングは、社会貢献と事業活動の両立を目指すものであり、消費者の善意を利用して自社の利益のみを追求することは不適切です。"}, {"num": 203, "text": "プロボノ活動が企業にもたらすメリットとして、適切でないものはどれか。", "options": {"1": "従業員のスキルアップや視野の拡大。", "2": "社会課題への理解が深まり、新たなビジネス機会の発見につながる可能性。", "3": "企業の社会的評価の向上。", "4": "従業員の本業のパフォーマンスが必ず低下すること。"}, "answer": 4, "explanation": "プロボノ活動は、むしろ従業員のスキルアップや視野の拡大につながり、本業のパフォーマンス向上に寄与することが多いとされています。"}, {"num": 204, "text": "企業がメセナ活動を行う意義として、最も適切なものはどれか。", "options": {"1": "文化・芸術の振興を通じて、豊かな社会の実現に貢献すること。", "2": "企業の製品を宣伝するための手段として活用すること。", "3": "政府の文化予算を削減させること。", "4": "従業員の福利厚生の一環として行うこと。"}, "answer": 1, "explanation": "メセナ活動は、企業が文化・芸術活動を支援することで、豊かな社会の実現と文化の発展に貢献する活動です。"}, {"num": 205, "text": "企業の社会貢献活動の形態のうち、「現物寄付」に該当するものはどれか。", "options": {"1": "NPOに対して金銭を寄付すること。", "2": "自社製品やサービスを無償で提供すること。", "3": "従業員がボランティア活動に参加すること。", "4": "社会課題に関する啓発キャンペーンを実施すること。"}, "answer": 2, "explanation": "現物寄付は、金銭ではなく、自社の製品、サービス、設備、施設などを無償で提供する形態の社会貢献活動です。"}, {"num": 206, "text": "企業が社会貢献活動を行う際に、従業員のエンゲージメント（働きがい）向上につながる理由として、最も適切なものはどれか。", "options": {"1": "社会貢献活動に参加すると、給与が増額されるため。", "2": "自社が社会に貢献していることへの誇りや、仕事の意義を実感できるため。", "3": "社会貢献活動は業務時間外に行われるため、仕事への影響がないため。", "4": "社会貢献活動への参加が昇進の条件となっているため。"}, "answer": 2, "explanation": "従業員が自社の社会貢献活動を通じて社会への貢献を実感することで、仕事への誇りや意義を感じ、エンゲージメントの向上につながります。"}, {"num": 207, "text": "企業が本業を通じた社会貢献を行うことの利点として、最も適切なものはどれか。", "options": {"1": "社会貢献活動にかかるコストをゼロにできること。", "2": "企業の強みやリソースを最大限に活用でき、持続可能でインパクトの大きい活動につながること。", "3": "本業と社会貢献を分離することで、経営効率が向上すること。", "4": "社会貢献活動の成果を測定する必要がなくなること。"}, "answer": 2, "explanation": "本業を通じた社会貢献は、企業の専門性、技術力、人材、ネットワークなどの経営資源を最大限に活用できるため、持続可能でインパクトの大きい活動が可能になります。"}, {"num": 208, "text": "企業が寄付活動を効果的に行うための方針として、適切でないものはどれか。", "options": {"1": "自社の経営理念やCSR方針に沿った寄付先を選定すること。", "2": "寄付の目的や期待される成果を明確にすること。", "3": "寄付先の活動内容や成果を全く確認しないこと。", "4": "寄付活動の実績をステークホルダーに報告すること。"}, "answer": 3, "explanation": "効果的な寄付活動のためには、寄付先の活動内容や成果を定期的に確認し、寄付の効果を検証することが重要です。"}, {"num": 209, "text": "企業が従業員のボランティア活動を支援する制度として、適切でないものはどれか。", "options": {"1": "ボランティア休暇制度", "2": "ボランティア活動への参加を理由に人事評価を下げること", "3": "活動費用の一部を補助する制度", "4": "社内でボランティア情報を共有し、参加を呼びかけること"}, "answer": 2, "explanation": "ボランティア活動への参加を理由に人事評価を下げることは、従業員の社会貢献意欲を阻害する不適切な対応です。"}, {"num": 210, "text": "企業とNPO/NGOの連携において、成功の鍵となる要素として最も重要なものは何か。", "options": {"1": "企業の資金力", "2": "共通の目標と価値観の共有", "3": "NPO/NGOの知名度", "4": "短期的な成果の追求"}, "answer": 2, "explanation": "企業とNPO/NGOの連携が成功するためには、双方が共通の目標と価値観を共有し、対等なパートナーシップに基づいて協働することが最も重要です。"}]}, {"id": 5, "title": "第5章 環境・人権・必須キーワード", "questions": [{"num": 211, "text": "地球温暖化の主な原因とされる、大気中の濃度が増加しているガスを総称して何というか。", "options": {"1": "オゾン", "2": "温室効果ガス", "3": "窒素酸化物", "4": "浮遊粒子状物質"}, "answer": 2, "explanation": "温室効果ガス（GHG: Greenhouse Gas）は、二酸化炭素（CO2）、メタン（CH4）、一酸化二窒素（N2O）、フロン類などの総称で、地球温暖化の主な原因とされています。"}, {"num": 212, "text": "気候変動に関する国際的な枠組みで、2020年以降の地球温暖化対策を定めた協定は何か。", "options": {"1": "京都議定書", "2": "パリ協定", "3": "コペンハーゲン合意", "4": "リオ宣言"}, "answer": 2, "explanation": "パリ協定は2015年にCOP21で採択され、2020年以降の気候変動対策の国際的枠組みです。京都議定書の後継にあたります。"}, {"num": 213, "text": "パリ協定が掲げる、世界の平均気温上昇を産業革命以前に比べてどの程度に抑えることを目標としているか。", "options": {"1": "3℃より十分低く保ち、1.5℃に抑える努力を追求する。", "2": "2℃より十分低く保ち、1.5℃に抑える努力を追求する。", "3": "1.5℃より十分低く保ち、1℃に抑える努力を追求する。", "4": "2.5℃より十分低く保ち、2℃に抑える努力を追求する。"}, "answer": 2, "explanation": "パリ協定は、世界の平均気温上昇を産業革命以前に比べて2℃より十分低く保ち、1.5℃に抑える努力を追求することを目標としています。"}, {"num": 214, "text": "企業が自らの事業活動で使用する電力を100%再生可能エネルギーで調達することを目標とする国際的なイニシアチブは何か。", "options": {"1": "RE100", "2": "EP100", "3": "EV100", "4": "SBT"}, "answer": 1, "explanation": "RE100（Renewable Energy 100%）は、事業活動で使用する電力を100%再生可能エネルギーで調達することを目標とする国際的なイニシアチブです。EP100はエネルギー効率、EV100は電気自動車に関するイニシアチブです。"}, {"num": 215, "text": "生物多様性の保全と持続可能な利用に関する国際条約は何か。", "options": {"1": "ワシントン条約", "2": "ラムサール条約", "3": "生物多様性条約", "4": "世界遺産条約"}, "answer": 3, "explanation": "生物多様性条約（CBD）は1992年の地球サミットで採択され、生物多様性の保全、持続可能な利用、遺伝資源から生じる利益の公正な配分を目的としています。"}, {"num": 216, "text": "2022年に採択された、2030年までに陸と海の30%以上を保全する「30by30目標」を含む、新たな世界目標を何というか。", "options": {"1": "愛知目標", "2": "昆明・モントリオール生物多様性枠組", "3": "ポスト2020生物多様性枠組", "4": "生物多様性国家戦略"}, "answer": 2, "explanation": "2022年のCOP15で採択された昆明・モントリオール生物多様性枠組は、2030年までに陸と海の30%以上を保全する「30by30目標」を含む、愛知目標の後継となる新たな世界目標です。"}, {"num": 217, "text": "従来の「採掘・製造・廃棄」という一方通行の経済モデルから脱却し、資源を循環させながら活用し続ける経済システムを何というか。", "options": {"1": "リニアエコノミー", "2": "サーキュラーエコノミー", "3": "シェアリングエコノミー", "4": "グリーンエコノミー"}, "answer": 2, "explanation": "サーキュラーエコノミー（循環型経済）は、資源を循環させながら活用し続ける経済システムです。リニアエコノミー（直線型経済）の「採掘・製造・廃棄」モデルからの転換を目指します。"}, {"num": 218, "text": "海洋に流出し、生態系や環境に深刻な影響を与えているプラスチックごみの問題を指す言葉は何か。", "options": {"1": "海洋酸性化", "2": "富栄養化", "3": "海洋プラスチック汚染", "4": "海水温上昇"}, "answer": 3, "explanation": "海洋プラスチック汚染は、年間数百万トンのプラスチックが海洋に流出し、海洋生態系や人間の健康に深刻な影響を与えている問題です。マイクロプラスチックの問題も含まれます。"}, {"num": 219, "text": "すべての人間が生まれながらに持つ、基本的な権利を保障するという考え方を何というか。", "options": {"1": "国民主権", "2": "基本的人権", "3": "法の下の平等", "4": "社会権"}, "answer": 2, "explanation": "基本的人権は、すべての人間が生まれながらに持つ権利であり、世界人権宣言（1948年）で国際的に確認されました。自由権、社会権、参政権などが含まれます。"}, {"num": 220, "text": "企業活動が人権に与える影響を特定・評価し、負の影響を防止・軽減するための取り組みを何というか。", "options": {"1": "人権デュー・ディリジェンス", "2": "人権教育", "3": "人権擁護", "4": "人権啓発"}, "answer": 1, "explanation": "人権デュー・ディリジェンス（人権DD）は、企業が自社の事業活動やサプライチェーンにおける人権への負の影響を特定・評価し、防止・軽減するための継続的なプロセスです。"}, {"num": 221, "text": "国連の「ビジネスと人権に関する指導原則」において、企業に求められる責任は何か。", "options": {"1": "人権を保護する義務", "2": "人権を尊重する責任", "3": "人権を促進する義務", "4": "人権を監視する責任"}, "answer": 2, "explanation": "国連の「ビジネスと人権に関する指導原則」（ラギー原則）では、国家には「人権を保護する義務」、企業には「人権を尊重する責任」が求められています。"}, {"num": 222, "text": "「ビジネスと人権に関する指導原則」の3つの柱に含まれないものはどれか。", "options": {"1": "国家の人権保護義務", "2": "企業の人権尊重責任", "3": "救済へのアクセス", "4": "企業の利益最大化義務"}, "answer": 4, "explanation": "指導原則の3つの柱は、①国家の人権保護義務、②企業の人権尊重責任、③救済へのアクセスです。企業の利益最大化義務は含まれません。"}, {"num": 223, "text": "日本政府が2020年に策定した、ビジネスと人権に関する行動計画の名称は何か。", "options": {"1": "「ビジネスと人権」に関する行動計画（2020-2025）", "2": "人権教育・啓発に関する基本計画", "3": "人権擁護施策推進法", "4": "企業人権憲章"}, "answer": 1, "explanation": "日本政府は2020年10月に「ビジネスと人権」に関する行動計画（NAP）を策定し、企業に対して人権デュー・ディリジェンスの実施を期待しています。"}, {"num": 224, "text": "企業が「グリーバンス・メカニズム（苦情処理メカニズム）」を設置する目的として、最も適切なものはどれか。", "options": {"1": "企業への批判を封じ込めること。", "2": "人権への負の影響を受けた人々が、救済を求めることができる仕組みを提供すること。", "3": "従業員の給与に関する不満を処理すること。", "4": "顧客からの製品クレームを処理すること。"}, "answer": 2, "explanation": "グリーバンス・メカニズムは、企業活動によって人権への負の影響を受けた人々が、苦情を申し立て、救済を求めることができる仕組みです。指導原則の第3の柱「救済へのアクセス」に関連します。"}, {"num": 225, "text": "温室効果ガスの排出量を算定する際に用いられる「スコープ1」とは何を指すか。", "options": {"1": "自社が直接排出する温室効果ガス", "2": "購入した電力・熱の使用に伴う間接排出", "3": "サプライチェーン全体での間接排出", "4": "製品の使用段階での排出"}, "answer": 1, "explanation": "スコープ1は、自社の工場や車両など、自社が直接排出する温室効果ガスを指します。燃料の燃焼や製造プロセスからの直接排出が該当します。"}, {"num": 226, "text": "温室効果ガスの排出量算定における「スコープ2」とは何を指すか。", "options": {"1": "自社が直接排出する温室効果ガス", "2": "購入した電力・熱・蒸気の使用に伴う間接排出", "3": "サプライチェーン上流での排出", "4": "製品の廃棄段階での排出"}, "answer": 2, "explanation": "スコープ2は、自社が購入した電力、熱、蒸気の使用に伴う間接的な温室効果ガスの排出を指します。"}, {"num": 227, "text": "温室効果ガスの排出量算定における「スコープ3」とは何を指すか。", "options": {"1": "自社が直接排出する温室効果ガス", "2": "購入した電力の使用に伴う間接排出", "3": "スコープ1・2以外の、サプライチェーン全体での間接排出", "4": "自社の敷地内での排出のみ"}, "answer": 3, "explanation": "スコープ3は、スコープ1・2以外の間接排出で、原材料の調達、輸送、製品の使用・廃棄など、サプライチェーン全体にわたる排出を含みます。15のカテゴリに分類されます。"}, {"num": 228, "text": "企業が科学的根拠に基づいた温室効果ガス排出削減目標を設定する国際的なイニシアチブは何か。", "options": {"1": "RE100", "2": "SBTi（Science Based Targets initiative）", "3": "CDP", "4": "TCFD"}, "answer": 2, "explanation": "SBTi（科学的根拠に基づく目標設定イニシアチブ）は、パリ協定の目標達成に整合した温室効果ガス排出削減目標の設定を企業に求める国際的なイニシアチブです。"}, {"num": 229, "text": "気候関連の財務情報開示を推進するために設立されたタスクフォースの略称は何か。", "options": {"1": "TNFD", "2": "TCFD", "3": "ISSB", "4": "GRI"}, "answer": 2, "explanation": "TCFD（Task Force on Climate-related Financial Disclosures）は、気候関連財務情報開示タスクフォースの略称で、G20の要請を受けて金融安定理事会（FSB）が設立しました。"}, {"num": 230, "text": "TCFDが推奨する情報開示の4つの柱に含まれないものはどれか。", "options": {"1": "ガバナンス", "2": "戦略", "3": "リスク管理", "4": "従業員満足度"}, "answer": 4, "explanation": "TCFDが推奨する情報開示の4つの柱は、①ガバナンス、②戦略、③リスク管理、④指標と目標です。従業員満足度は含まれません。"}, {"num": 231, "text": "企業の環境マネジメントシステムに関する国際規格は何か。", "options": {"1": "ISO 9001", "2": "ISO 14001", "3": "ISO 26000", "4": "ISO 45001"}, "answer": 2, "explanation": "ISO 14001は環境マネジメントシステム（EMS）の国際規格です。ISO 9001は品質管理、ISO 26000は社会的責任、ISO 45001は労働安全衛生に関する規格です。"}, {"num": 232, "text": "製品やサービスのライフサイクル全体を通じた環境負荷を定量的に評価する手法を何というか。", "options": {"1": "環境アセスメント", "2": "ライフサイクルアセスメント（LCA）", "3": "環境監査", "4": "カーボンフットプリント"}, "answer": 2, "explanation": "LCA（Life Cycle Assessment）は、製品やサービスの原材料調達から製造、使用、廃棄・リサイクルまでのライフサイクル全体を通じた環境負荷を定量的に評価する手法です。"}, {"num": 233, "text": "製品やサービスのライフサイクル全体で排出される温室効果ガスの量をCO2に換算して表示する仕組みを何というか。", "options": {"1": "エコラベル", "2": "カーボンフットプリント", "3": "環境報告書", "4": "グリーン調達"}, "answer": 2, "explanation": "カーボンフットプリント（CFP）は、製品やサービスのライフサイクル全体で排出される温室効果ガスの量をCO2に換算して表示する仕組みです。"}, {"num": 234, "text": "企業が環境に配慮した製品やサービスを優先的に購入する取り組みを何というか。", "options": {"1": "グリーン調達", "2": "CSR調達", "3": "一般競争入札", "4": "随意契約"}, "ans
