wer": 1, "explanation": "グリーン調達は、企業が原材料や部品、サービスを調達する際に、環境負荷の少ないものを優先的に選択する取り組みです。"}, {"num": 235, "text": "日本の「グリーン購入法」の目的として、最も適切なものはどれか。", "options": {"1": "国等の機関が環境に配慮した物品等の調達を推進し、環境負荷の低減を図ること。", "2": "企業に環境に配慮した製品の製造を義務付けること。", "3": "消費者に環境に配慮した製品の購入を義務付けること。", "4": "環境に配慮した製品の価格を統制すること。"}, "answer": 1, "explanation": "グリーン購入法（国等による環境物品等の調達の推進等に関する法律）は、国等の機関が率先して環境に配慮した物品等を調達することを義務付け、環境負荷の低減を図ることを目的としています。"}, {"num": 236, "text": "企業が「カーボンニュートラル」を達成するとは、どのような状態を指すか。", "options": {"1": "二酸化炭素の排出量をゼロにすること。", "2": "温室効果ガスの排出量と吸収量を均衡させ、実質的にゼロにすること。", "3": "化石燃料の使用を完全に停止すること。", "4": "再生可能エネルギーのみを使用すること。"}, "answer": 2, "explanation": "カーボンニュートラルは、温室効果ガスの排出量から吸収量・除去量を差し引いて、実質的にゼロにすることを意味します。排出量をゼロにすることではありません。"}, {"num": 237, "text": "「カーボンオフセット」とは何か。最も適切な説明を選びなさい。", "options": {"1": "自社の排出量を削減すること。", "2": "自社で削減しきれない温室効果ガスの排出量を、他の場所での削減・吸収活動によって相殺すること。", "3": "炭素税を支払うこと。", "4": "排出量取引に参加すること。"}, "answer": 2, "explanation": "カーボンオフセットは、自社の排出削減努力を行った上で、削減しきれない分を、植林やクリーンエネルギー事業などの他の場所での削減・吸収活動によって相殺する仕組みです。"}, {"num": 238, "text": "「排出量取引制度（キャップ・アンド・トレード）」の仕組みとして、最も適切なものはどれか。", "options": {"1": "企業が自主的に排出量の目標を設定する制度。", "2": "政府が企業に排出枠を設定し、余剰分や不足分を企業間で売買できる制度。", "3": "企業が排出量に応じて税金を支払う制度。", "4": "企業が排出量を自由に決定できる制度。"}, "answer": 2, "explanation": "排出量取引制度（キャップ・アンド・トレード）は、政府が企業に排出枠（キャップ）を設定し、排出枠の余剰分や不足分を企業間で売買（トレード）できる制度です。"}, {"num": 239, "text": "「炭素税（カーボンタックス）」とは何か。最も適切な説明を選びなさい。", "options": {"1": "炭素を含む製品の輸入に課される関税。", "2": "化石燃料の炭素含有量に応じて課される税金で、排出削減のインセンティブとなる。", "3": "再生可能エネルギーの導入に対する補助金。", "4": "環境保全活動に対する寄付金。"}, "answer": 2, "explanation": "炭素税は、化石燃料の炭素含有量に応じて課される税金で、排出コストを内部化することで、企業や消費者に温室効果ガスの排出削減を促すインセンティブとなります。"}, {"num": 240, "text": "「グリーンボンド」とは何か。最も適切な説明を選びなさい。", "options": {"1": "環境関連の株式。", "2": "環境改善効果のあるプロジェクトに資金を充当するために発行される債券。", "3": "環境に配慮した企業の社債。", "4": "政府が発行する国債。"}, "answer": 2, "explanation": "グリーンボンドは、再生可能エネルギー、省エネルギー、汚染防止など、環境改善効果のあるプロジェクトに資金を充当するために発行される債券です。"}, {"num": 241, "text": "「ソーシャルボンド」とは何か。最も適切な説明を選びなさい。", "options": {"1": "SNSを活用した資金調達。", "2": "社会課題の解決に資するプロジェクトに資金を充当するために発行される債券。", "3": "社会保険料の支払いに充てられる債券。", "4": "社会福祉法人が発行する債券。"}, "answer": 2, "explanation": "ソーシャルボンドは、手頃な住宅、教育、医療、雇用創出など、社会課題の解決に資するプロジェクトに資金を充当するために発行される債券です。"}, {"num": 242, "text": "「サステナビリティ・リンク・ローン」の特徴として、最も適切なものはどれか。", "options": {"1": "環境プロジェクトのみに資金を充当するローン。", "2": "借り手のサステナビリティに関するKPI達成状況に応じて、融資条件が変動するローン。", "3": "社会貢献活動に対する無利子のローン。", "4": "途上国への開発援助のためのローン。"}, "answer": 2, "explanation": "サステナビリティ・リンク・ローンは、借り手が設定したサステナビリティに関するKPI（重要業績評価指標）の達成状況に応じて、金利などの融資条件が変動する仕組みのローンです。"}, {"num": 243, "text": "「インパクト投資」とは何か。最も適切な説明を選びなさい。", "options": {"1": "高いリターンのみを追求する投資。", "2": "財務的リターンと並行して、ポジティブで測定可能な社会的・環境的インパクトを意図的に生み出すことを目指す投資。", "3": "環境関連の株式のみに投資すること。", "4": "短期的な利益を追求する投機的な投資。"}, "answer": 2, "explanation": "インパクト投資は、経済的リターンだけでなく、社会的・環境的にポジティブで測定可能なインパクトを意図的に生み出すことを目指す投資手法です。"}, {"num": 244, "text": "「ESGインテグレーション」とは何か。最も適切な説明を選びなさい。", "options": {"1": "ESGに特化したファンドに投資すること。", "2": "従来の財務分析にESG要素を体系的に組み込んで投資判断を行うこと。", "3": "ESGスコアの低い企業を投資対象から除外すること。", "4": "ESGに関する株主提案を行うこと。"}, "answer": 2, "explanation": "ESGインテグレーションは、従来の財務分析にESG（環境・社会・ガバナンス）要素を体系的に組み込んで、より包括的な投資判断を行うアプローチです。"}, {"num": 245, "text": "「ネガティブ・スクリーニング」とは何か。最も適切な説明を選びなさい。", "options": {"1": "ESGスコアの高い企業を選別して投資すること。", "2": "特定の業種や企業（武器、たばこ、ギャンブルなど）を投資対象から除外すること。", "3": "投資先企業に対してESGの改善を要求すること。", "4": "ESGに関する情報開示を求めること。"}, "answer": 2, "explanation": "ネガティブ・スクリーニングは、倫理的・社会的・環境的な基準に基づいて、特定の業種や企業を投資対象から除外するESG投資手法です。"}, {"num": 246, "text": "投資家が投資先企業に対して、ESGに関する課題の改善を求めて対話や議決権行使を行うことを何というか。", "options": {"1": "ネガティブ・スクリーニング", "2": "エンゲージメント（対話）", "3": "ダイベストメント", "4": "ベンチマーキング"}, "answer": 2, "explanation": "エンゲージメント（対話）は、投資家が投資先企業に対してESGに関する課題の改善を求めて、建設的な対話や議決権行使を行う活動です。"}, {"num": 247, "text": "「ダイベストメント」とは何か。最も適切な説明を選びなさい。", "options": {"1": "新規投資を行うこと。", "2": "特定の企業や業種から投資を引き揚げること。", "3": "投資先を多様化すること。", "4": "投資額を増やすこと。"}, "answer": 2, "explanation": "ダイベストメント（投資撤退）は、特定の企業や業種（特に化石燃料関連企業など）から投資を引き揚げることを指します。"}, {"num": 248, "text": "日本のGPIF（年金積立金管理運用独立行政法人）がESG投資を推進する理由として、最も適切なものはどれか。", "options": {"1": "短期的な運用収益を最大化するため。", "2": "長期的な投資収益の向上と、受益者のために持続可能な社会の実現に貢献するため。", "3": "政府の指示に従うため。", "4": "海外の投資家に追随するため。"}, "answer": 2, "explanation": "GPIFは世界最大の年金基金として、長期的な投資収益の向上と、受益者である国民のために持続可能な社会の実現に貢献することを目的にESG投資を推進しています。"}, {"num": 249, "text": "「PRI（責任投資原則）」とは何か。最も適切な説明を選びなさい。", "options": {"1": "企業が責任ある経営を行うための原則。", "2": "投資家がESG課題を投資の意思決定プロセスに組み込むことを宣言する国際的な原則。", "3": "政府が投資家を規制するための原則。", "4": "証券取引所が上場企業に求める原則。"}, "answer": 2, "explanation": "PRI（Principles for Responsible Investment、責任投資原則）は、2006年に国連が支援して策定された、投資家がESG課題を投資の意思決定プロセスに組み込むことを宣言する6つの原則です。"}, {"num": 250, "text": "「スチュワードシップ・コード」とは何か。最も適切な説明を選びなさい。", "options": {"1": "企業が従業員に対して果たすべき責任を定めたコード。", "2": "機関投資家が投資先企業との建設的な対話を通じて、企業価値の向上や持続的成長を促すための行動指針。", "3": "政府が企業に対して環境保全を求めるコード。", "4": "消費者が企業に対して品質向上を求めるコード。"}, "answer": 2, "explanation": "スチュワードシップ・コードは、機関投資家が投資先企業との建設的な対話（エンゲージメント）を通じて、企業価値の向上や持続的成長を促すための行動指針です。日本版は2014年に策定されました。"}, {"num": 251, "text": "「コーポレートガバナンス・コード」とは何か。最も適切な説明を選びなさい。", "options": {"1": "企業の製品品質を管理するためのコード。", "2": "上場企業が守るべき企業統治の指針で、株主の権利、取締役会の責務、情報開示などを定めたもの。", "3": "企業の従業員が守るべき行動規範。", "4": "企業の環境対策に関するガイドライン。"}, "answer": 2, "explanation": "コーポレートガバナンス・コードは、東京証券取引所が策定した上場企業向けの企業統治の指針で、株主の権利・平等性の確保、取締役会の責務、適切な情報開示と透明性の確保などを定めています。"}, {"num": 252, "text": "企業のサステナビリティ情報開示に関する国際的な基準を策定する組織として、2021年に設立されたのは何か。", "options": {"1": "GRI（Global Reporting Initiative）", "2": "ISSB（International Sustainability Standards Board）", "3": "CDP", "4": "SASB"}, "answer": 2, "explanation": "ISSB（国際サステナビリティ基準審議会）は、2021年のCOP26でIFRS財団の下に設立され、サステナビリティ関連の財務情報開示に関する国際的な基準（IFRS S1、S2）を策定しています。"}, {"num": 253, "text": "GRI（Global Reporting Initiative）が策定する「GRIスタンダード」の特徴として、最も適切なものはどれか。", "options": {"1": "財務情報のみを対象とした報告基準。", "2": "企業が経済・環境・社会に与えるインパクトを報告するための、世界で最も広く使われているサステナビリティ報告基準。", "3": "投資家向けの財務報告基準。", "4": "政府向けの統計報告基準。"}, "answer": 2, "explanation": "GRIスタンダードは、企業が経済・環境・社会に与えるインパクトを報告するための、世界で最も広く使われているサステナビリティ報告基準です。マルチステークホルダー向けの報告を重視しています。"}, {"num": 254, "text": "「CDP」とは何か。最も適切な説明を選びなさい。", "options": {"1": "企業の財務データを収集する機関。", "2": "企業や自治体に対して、気候変動、水資源、森林に関する情報開示を求める国際的な非営利団体。", "3": "企業の製品安全性を認証する機関。", "4": "企業の人事制度を評価する機関。"}, "answer": 2, "explanation": "CDP（旧カーボン・ディスクロージャー・プロジェクト）は、企業や自治体に対して気候変動、水資源、森林に関する環境情報の開示を求め、評価する国際的な非営利団体です。"}, {"num": 255, "text": "「マテリアリティ（重要課題）」の特定が企業のサステナビリティ経営において重要とされる理由として、最も適切なものはどれか。", "options": {"1": "すべての社会課題に均等に取り組むことが不可能であるため、自社にとって最も重要な課題を優先的に特定し、経営資源を集中させる必要があるため。", "2": "投資家が求めるすべての情報を開示するため。", "3": "競合他社と同じ課題に取り組むため。", "4": "法律で義務付けられているため。"}, "answer": 1, "explanation": "マテリアリティの特定は、限られた経営資源を最も重要な課題に集中させ、効果的なサステナビリティ経営を実現するために不可欠なプロセスです。"}, {"num": 256, "text": "「ダブル・マテリアリティ」とは何か。最も適切な説明を選びなさい。", "options": {"1": "マテリアリティを2回評価すること。", "2": "企業が社会・環境に与える影響（インパクト・マテリアリティ）と、社会・環境の変化が企業の財務に与える影響（財務マテリアリティ）の両方を考慮すること。", "3": "2つの異なる業界のマテリアリティを比較すること。", "4": "マテリアリティの重要度を2段階で評価すること。"}, "answer": 2, "explanation": "ダブル・マテリアリティは、EUのCSRD（企業サステナビリティ報告指令）で採用されている概念で、企業の社会・環境への影響と、社会・環境の変化が企業財務に与える影響の両面を考慮します。"}, {"num": 257, "text": "「ウォッシュ」問題（グリーンウォッシュ、SDGsウォッシュなど）が問題視される理由として、最も適切なものはどれか。", "options": {"1": "企業の広告費が増加するため。", "2": "消費者や投資家を誤解させ、実質的な社会・環境課題の解決を遅らせるため。", "3": "企業の売上が減少するため。", "4": "政府の規制が強化されるため。"}, "answer": 2, "explanation": "ウォッシュ問題は、実態を伴わない見せかけの取り組みにより、消費者や投資家を誤解させ、真の社会・環境課題の解決を遅らせる点が問題視されています。"}, {"num": 258, "text": "「Just Transition（公正な移行）」とは何か。最も適切な説明を選びなさい。", "options": {"1": "企業の経営陣が公正に交代すること。", "2": "脱炭素社会への移行に伴い、影響を受ける労働者や地域社会に対して、公正かつ包括的な支援を行うこと。", "3": "公正な貿易を推進すること。", "4": "公正な選挙を実施すること。"}, "answer": 2, "explanation": "Just Transition（公正な移行）は、脱炭素社会への移行に伴い、化石燃料産業などで雇用を失う労働者や、経済的影響を受ける地域社会に対して、再教育・再就職支援などの公正かつ包括的な支援を行うことを指します。"}, {"num": 259, "text": "「プラネタリー・バウンダリー（地球の限界）」とは何か。最も適切な説明を選びなさい。", "options": {"1": "地球上で人類が利用できる土地の面積の限界。", "2": "人類が安全に活動できる範囲の境界を、地球システムの9つのプロセスについて科学的に定義したもの。", "3": "地球の人口の上限。", "4": "地球のエネルギー資源の総量。"}, "answer": 2, "explanation": "プラネタリー・バウンダリーは、ストックホルム・レジリエンス・センターのヨハン・ロックストロームらが2009年に提唱した概念で、気候変動、生物多様性の喪失、窒素・リンの循環など9つの地球システムプロセスについて、人類が安全に活動できる範囲の境界を科学的に定義しています。"}, {"num": 260, "text": "「ステークホルダー資本主義」とは何か。最も適切な説明を選びなさい。", "options": {"1": "株主の利益のみを最大化する経営。", "2": "株主だけでなく、従業員、顧客、地域社会、環境など、すべてのステークホルダーの利益を考慮した経営。", "3": "政府が企業経営に介入する経済体制。", "4": "労働者が企業を所有する経済体制。"}, "answer": 2, "explanation": "ステークホルダー資本主義は、2020年のダボス会議（世界経済フォーラム）で提唱された概念で、株主至上主義から脱却し、すべてのステークホルダーの利益を考慮した経営を目指します。"}, {"num": 261, "text": "「エシカル消費」の具体例として、適切でないものはどれか。", "options": {"1": "フェアトレード認証の付いたコーヒーを購入する。", "2": "地元で生産された食材を優先的に購入する。", "3": "環境に配慮した製品よりも、常に最も安い製品を選ぶ。", "4": "リサイクル素材を使用した製品を選ぶ。"}, "answer": 3, "explanation": "エシカル消費は、価格だけでなく環境・社会への影響を考慮して商品を選択する消費行動です。常に最も安い製品を選ぶことはエシカル消費には該当しません。"}, {"num": 262, "text": "「食品ロス」の削減がサステナビリティの観点から重要とされる理由として、適切でないものはどれか。", "options": {"1": "食品の生産・輸送・廃棄に伴う温室効果ガスの排出を削減できるため。", "2": "限りある食料資源の有効活用につながるため。", "3": "廃棄コストの削減により、企業の経済的メリットがあるため。", "4": "食品ロスが増えると、食品の価格が下がり消費者にとって有利になるため。"}, "answer": 4, "explanation": "食品ロスの増加は、資源の無駄遣い、温室効果ガスの排出増加、廃棄コストの増大などの問題を引き起こします。食品ロスが増えても消費者に有利になるわけではありません。"}, {"num": 263, "text": "「再生可能エネルギー」に該当しないものはどれか。", "options": {"1": "太陽光発電", "2": "風力発電", "3": "天然ガス火力発電", "4": "地熱発電"}, "answer": 3, "explanation": "天然ガスは化石燃料であり、再生可能エネルギーには該当しません。太陽光、風力、地熱、水力、バイオマスなどが再生可能エネルギーに分類されます。"}, {"num": 264, "text": "「水ストレス」とは何か。最も適切な説明を選びなさい。", "options": {"1": "水を使った運動によるストレス。", "2": "水の需要が利用可能な水資源を上回り、水不足が生じている状態。", "3": "水質汚染によるストレス。", "4": "洪水による被害。"}, "answer": 2, "explanation": "水ストレスは、水の需要が利用可能な水資源を上回り、水不足が生じている状態を指します。世界人口の約4分の1が水ストレスの高い地域に住んでいるとされています。"}, {"num": 265, "text": "「生態系サービス」とは何か。最も適切な説明を選びなさい。", "options": {"1": "生態系に関する研究サービス。", "2": "人間が生態系から受ける恩恵（食料、水、気候調節、文化的価値など）の総称。", "3": "生態系を保護するためのサービス業。", "4": "生態系に関するコンサルティングサービス。"}, "answer": 2, "explanation": "生態系サービスは、供給サービス（食料、水など）、調整サービス（気候調節、洪水防止など）、文化的サービス（レクリエーション、精神的価値など）、基盤サービス（土壌形成、光合成など）の4つに分類されます。"}, {"num": 266, "text": "「脱炭素」と「低炭素」の違いとして、最も適切なものはどれか。", "options": {"1": "両者は同じ意味である。", "2": "「脱炭素」は温室効果ガスの排出を実質ゼロにすることを目指し、「低炭素」は排出量を削減することを目指す。", "3": "「低炭素」の方が「脱炭素」よりも高い目標を掲げている。", "4": "「脱炭素」は企業のみが対象で、「低炭素」は個人のみが対象である。"}, "answer": 2, "explanation": "「脱炭素」はカーボンニュートラル（実質排出ゼロ）を目指すより高い目標であり、「低炭素」は排出量の削減を目指す概念です。"}, {"num": 267, "text": "「SDGsウォッシュ」を避けるために企業が行うべきこととして、適切でないものはどれか。", "options": {"1": "SDGsへの貢献を具体的な数値目標とともに示すこと。", "2": "取り組みの進捗状況を透明性をもって報告すること。", "3": "実態を伴わないSDGsバッジの使用やロゴの掲示のみを行うこと。", "4": "自社の事業活動がSDGsの各目標にどのように関連するかを分析すること。"}, "answer": 3, "explanation": "実態を伴わないSDGsバッジの使用やロゴの掲示のみを行うことは、典型的なSDGsウォッシュの例であり、避けるべき行為です。"}, {"num": 268, "text": "「サステナブル・ファイナンス」とは何か。最も適切な説明を選びなさい。", "options": {"1": "金融機関の経営を持続可能にすること。", "2": "環境・社会・ガバナンスの要素を考慮した金融活動の総称で、持続可能な経済・社会の実現を目指すもの。", "3": "金融商品の手数料を削減すること。", "4": "金融機関の従業員の福利厚生を充実させること。"}, "answer": 2, "explanation": "サステナブル・ファイナンスは、ESG要素を考慮した投資、融資、保険などの金融活動の総称で、持続可能な経済・社会の実現を目指します。グリーンボンド、ソーシャルボンド、ESG投資などが含まれます。"}, {"num": 269, "text": "環境に配慮しているように見せかけて、実態はそうではない企業活動や製品を批判的に指す言葉は何か。", "options": {"1": "グリーンウォッシュ", "2": "ホワイトウォッシュ", "3": "ブルーウォッシュ", "4": "レッドウォッシュ"}, "answer": 1, "explanation": "グリーンウォッシュは、環境に配慮しているように見せかけて、実態はそうではない企業活動や製品を批判的に指す言葉です。「ホワイトウォッシュ（うわべを取り繕う）」と「グリーン」を組み合わせた造語です。"}, {"num": 270, "text": "企業が自社の利益だけでなく、社会全体の利益（公益）を考慮して事業を行うべきだという考え方を何というか。", "options": {"1": "株主至上主義", "2": "公益資本主義", "3": "国家資本主義", "4": "自由資本主義"}, "answer": 2, "explanation": "公益資本主義は、企業が自社の利益だけでなく、社会全体の利益（公益）を考慮して事業を行うべきだという考え方で、ステークホルダー資本主義とも関連する概念です。"}]}, {"id": 6, "title": "第6章 模擬試験(総合問題)", "questions": [{"num": 271, "text": "次の文章の空欄（ア）と（イ）に入る語句の組み合わせとして、最も適切なものを選択肢から選びなさい。 「2015年に国連で採択されたSDGsは、社会、経済、環境の3つの側面を統合的に捉え、誰一人取り残さない社会を目指す普遍的な目標である。その前身である（ア）が主に途上国の開発課題を対象としていたのに対し、SDGsは先進国を含むすべての国に行動を求めている。また、企業や（イ）など、多様な主体の参画を重視している点も大きな特徴である。」", "options": {"1": "ア：京都議定書 イ：政府機関", "2": "ア：MDGs（ミレニアム開発目標） イ：市民社会", "3": "ア：パリ協定 イ：投資家", "4": "ア：アジェンダ21 イ：国際機関"}, "answer": 2, "explanation": "SDGsの前身はMDGs（ミレニアム開発目標、2001〜2015年）です。MDGsが主に途上国の開発課題を対象としていたのに対し、SDGsは先進国を含むすべての国に行動を求め、企業や市民社会など多様な主体の参画を重視しています。"}, {"num": 272, "text": "ESG投資に関する記述として、最も適切なものはどれか。", "options": {"1": "企業の財務情報のみを基に投資判断を行う手法である。", "2": "環境（E）、社会（S）、ガバナンス（G）の要素を考慮しない伝統的な投資手法である。", "3": "特定の非倫理的な業種（タバコ、武器など）を投資対象から除外するネガティブ・スクリーニングは、ESG投資の手法には含まれない。", "4": "企業との対話（エンゲージメント）を通じて、企業のサステナビリティに関する取り組みを促すこともESG投資の重要な手法の一つである。"}, "answer": 4, "explanation": "ESG投資には、ネガティブ・スクリーニング、ESGインテグレーション、エンゲージメント（対話）、インパクト投資など、さまざまな手法があります。企業との対話を通じてサステナビリティの取り組みを促すエンゲージメントは、重要な手法の一つです。"}, {"num": 273, "text": "ISO 26000（社会的責任に関する手引）に関する記述として、誤っているものはどれか。", "options": {"1": "企業だけでなく、政府やNPOなど、あらゆる種類の組織を対象としている。", "2": "第三者認証を目的とした要求事項規格であり、取得が義務付けられている。", "3": "「人権」「労働慣行」「環境」など、7つの中核主題を定めている。", "4": "組織が社会的責任を果たすためのガイダンス（手引書）として発行された。"}, "answer": 2, "explanation": "ISO 26000は、第三者認証を目的とした要求事項規格ではなく、組織が社会的責任を果たすためのガイダンス（手引書）です。認証取得は義務付けられておらず、あくまで自主的に活用するものです。"}, {"num": 274, "text": "「ビジネスと人権に関する指導原則」において示された、企業が人権への負の影響を特定し、防止・軽減するために実施すべきプロセスを何というか。", "options": {"1": "人権監査", "2": "人権デュー・ディリジェンス", "3": "人権インパクト評価", "4": "人権モニタリング"}, "answer": 2, "explanation": "人権デュー・ディリジェンスは、「ビジネスと人権に関する指導原則」で示された、企業が人権への負の影響を特定し、防止・軽減するために実施すべき継続的なプロセスです。"}, {"num": 275, "text": "次のサステナビリティ関連のキーワードとその説明の組み合わせとして、最も適切でないものはどれか。", "options": {"1": "サーキュラーエコノミー：資源を廃棄せず、循環させながら価値を最大限に引き出す経済モデル。", "2": "グリーンウォッシュ：環境に配慮しているように見せかけ、実態が伴わないこと。", "3": "フェアトレード：途上国の生産者と公正な価格で取引し、その自立を支援する貿易の仕組み。", "4": "トリプルボトムライン：企業の成果を「経済」と「環境」の2つの側面から評価する考え方。"}, "answer": 4, "explanation": "トリプルボトムラインは、企業の成果を「経済」「環境」「社会」の3つの側面から評価する考え方です。2つの側面ではなく3つの側面であるため、選択肢4の説明は誤りです。"}, {"num": 276, "text": "次の記述のうち、「パリ協定」に関する説明として誤っているものはどれか。", "options": {"1": "2015年にCOP21で採択された。", "2": "世界の平均気温上昇を産業革命以前に比べて2℃より十分低く保つことを目標としている。", "3": "先進国のみに温室効果ガスの排出削減義務を課している。", "4": "各国が自主的に削減目標（NDC）を設定し、定期的に見直すことを求めている。"}, "answer": 3, "explanation": "パリ協定は、先進国のみに削減義務を課した京都議定書とは異なり、すべての国が自主的に削減目標（NDC：国が決定する貢献）を設定し、定期的に見直すことを求めています。"}, {"num": 277, "text": "企業がサステナビリティ報告書を作成する際に、「マテリアリティ分析」を行う目的として、最も適切なものはどれか。", "options": {"1": "報告書のページ数を削減するため。", "2": "自社にとって重要なサステナビリティ課題を特定し、優先的に報告・対応するため。", "3": "競合他社の報告書と同じ内容にするため。", "4": "法律で義務付けられた項目のみを報告するため。"}, "answer": 2, "explanation": "マテリアリティ分析は、自社にとって最も重要なサステナビリティ課題を特定し、限られた経営資源を優先的に配分するために行います。報告書においても、重要な課題に焦点を当てた報告が求められます。"}, {"num": 278, "text": "次の国際的なイニシアチブ・規格とその内容の組み合わせとして、誤っているものはどれか。", "options": {"1": "RE100：事業活動で使用する電力を100%再生可能エネルギーで調達することを目指すイニシアチブ。", "2": "SBTi：科学的根拠に基づいた温室効果ガス排出削減目標の設定を推進するイニシアチブ。", "3": "ISO 14001：品質マネジメントシステムに関する国際規格。", "4": "GRI：サステナビリティ報告に関する国際的な基準を策定する組織。"}, "answer": 3, "explanation": "ISO 14001は品質マネジメントシステムではなく、環境マネジメントシステムに関する国際規格です。品質マネジメントシステムに関する国際規格はISO 9001です。"}, {"num": 279, "text": "企業が「統合報告書」を発行する意義として、最も適切なものはどれか。", "options": {"1": "財務情報のみを詳細に報告するため。", "2": "財務資本だけでなく、人的資本、知的資本、自然資本など、多様な資本の価値創造プロセスを示すため。", "3": "CSR報告書の代替として、コスト削減のため。", "4": "法律で義務付けられているため。"}, "answer": 2, "explanation": "統合報告書は、財務情報と非財務情報を統合し、企業が財務資本、人的資本、知的資本、社会・関係資本、自然資本、製造資本などの多様な資本をどのように活用して価値を創造しているかを示すものです。"}, {"num": 280, "text": "「SDGsの17の目標」のうち、「目標13」が掲げるテーマは何か。", "options": {"1": "質の高い教育をみんなに", "2": "気候変動に具体的な対策を", "3": "海の豊かさを守ろう", "4": "陸の豊かさも守ろう"}, "answer": 2, "explanation": "SDGs目標13は「気候変動に具体的な対策を（Climate Action）」です。目標4が「質の高い教育をみんなに」、目標14が「海の豊かさを守ろう」、目標15が「陸の豊かさも守ろう」です。"}, {"num": 281, "text": "次の記述のうち、「コーポレートガバナンス・コード」に関する説明として誤っているものはどれか。", "options": {"1": "東京証券取引所が策定した、上場企業向けの企業統治の指針である。", "2": "法的拘束力を持つ法律であり、違反した場合は罰則が科される。", "3": "「コンプライ・オア・エクスプレイン」の原則に基づいている。", "4": "取締役会の多様性の確保や、サステナビリティ課題への対応を求めている。"}, "answer": 2, "explanation": "コーポレートガバナンス・コードは法律ではなく、「コンプライ・オア・エクスプレイン（遵守するか、遵守しない場合はその理由を説明する）」の原則に基づくソフトローです。法的拘束力はありません。"}, {"num": 282, "text": "企業のCSR活動と本業の関係について、最も適切な考え方はどれか。", "options": {"1": "CSR活動は本業とは完全に切り離して行うべきである。", "2": "CSR活動は本業を通じて行うことで、より大きなインパクトと持続可能性を実現できる。", "3": "CSR活動は利益が出たときにのみ行えばよい。", "4": "CSR活動は広報部門のみが担当すべきである。"}, "answer": 2, "explanation": "CSR活動を本業と切り離すのではなく、本業を通じて行うことで、企業の専門性やリソースを最大限に活用でき、より大きな社会的インパクトと事業の持続可能性を同時に実現できます。"}, {"num": 283, "text": "次の記述のうち、「人的資本経営」に関する説明として最も適切なものはどれか。", "options": {"1": "人件費を最小限に抑えることで、企業の利益を最大化する経営手法。", "2": "人材を「コスト」ではなく「資本」として捉え、その価値を最大限に引き出すことで、中長期的な企業価値向上につなげる経営手法。", "3": "従業員の数を増やすことで、企業の規模を拡大する経営手法。", "4": "AIやロボットで人材を代替することで、効率化を図る経営手法。"}, "answer": 2, "explanation": "人的資本経営は、経済産業省が推進する「人材版伊藤レポート」でも提唱されている概念で、人材への投資を通じて中長期的な企業価値向上を目指す経営手法です。"}, {"num": 284, "text": "企業が「ネットゼロ」目標を達成するためのアプローチとして、適切でないものはどれか。", "options": {"1": "省エネルギーの推進による排出量の削減。", "2": "再生可能エネルギーへの転換。", "3": "削減しきれない排出量のカーボンオフセット。", "4": "排出量の算定を行わず、宣言のみを行うこと。"}, "answer": 4, "explanation": "ネットゼロ目標の達成には、まず排出量を正確に算定し、削減計画を策定・実行することが不可欠です。排出量の算定を行わず宣言のみを行うことは、グリーンウォッシュに該当する可能性があります。"}, {"num": 285, "text": "次の記述のうち、「サプライチェーン・デュー・ディリジェンス」に関する説明として誤っているものはどれか。", "options": {"1": "サプライチェーン全体における人権・環境リスクを特定・評価するプロセスである。", "2": "リスクが特定された場合、防止・軽減策を講じる必要がある。", "3": "一度実施すれば、その後は再実施する必要はない。", "4": "EUでは、サプライチェーン・デュー・ディリジェンスを義務化する法制化の動きがある。"}, "answer": 3, "explanation": "サプライチェーン・デュー・ディリジェンスは、一度きりではなく、継続的に実施すべきプロセスです。サプライチェーンの状況は常に変化するため、定期的なリスク評価と対応の見直しが必要です。"}, {"num": 286, "text": "企業が「気候変動シナリオ分析」を行う目的として、最も適切なものはどれか。", "options": {"1": "将来の気温を正確に予測するため。", "2": "異なる気候変動シナリオの下で、自社の事業にどのようなリスクと機会が生じるかを分析し、戦略の強靭性を評価するため。", "3": "温室効果ガスの排出量を算定するため。", "4": "環境報告書を作成するため。"}, "answer": 2, "explanation": "気候変動シナリオ分析は、TCFDが推奨する手法で、1.5℃シナリオや4℃シナリオなど、異なる気候変動シナリオの下で自社の事業にどのようなリスクと機会が生じるかを分析し、経営戦略の強靭性（レジリエンス）を評価するものです。"}, {"num": 287, "text": "次の記述のうち、「ソーシャルビジネス」に関する説明として最も適切なものはどれか。", "options": {"1": "利益を一切追求せず、寄付金のみで運営される事業。", "2": "社会課題の解決を主な目的とし、ビジネスの手法を用いて持続的に活動する事業。", "3": "政府が運営する公共サービス。", "4": "SNSを活用したマーケティング手法。"}, "answer": 2, "explanation": "ソーシャルビジネスは、社会課題の解決を主な目的としつつ、ビジネスの手法を用いて収益を上げ、持続的に活動する事業です。寄付金のみに依存するのではなく、事業収益で自立的に運営されます。"}, {"num": 288, "text": "「TCFD提言」と「TNFD提言」の違いとして、最も適切なものはどれか。", "options": {"1": "TCFDは気候変動に関する財務情報開示、TNFDは自然関連の財務情報開示を推進している。", "2": "TCFDは自然関連、TNFDは気候変動関連の情報開示を推進している。", "3": "両者は同じ内容の提言である。", "4": "TCFDは企業向け、TNFDは政府向けの提言である。"}, "answer": 1, "explanation": "TCFD（Task Force on Climate-related Financial Disclosures）は気候変動に関する財務情報開示、TNFD（Taskforce on Nature-related Financial Disclosures）は自然資本・生物多様性に関する財務情報開示を推進しています。"}, {"num": 289, "text": "企業が「ステークホルダー・エンゲージメント」を行う際に重要なこととして、適切でないものはどれか。", "options": {"1": "多様なステークホルダーの意見を幅広く聴取すること。", "2": "対話の結果を経営に反映させること。", "3": "企業に都合の悪い意見は無視すること。", "4": "対話のプロセスと結果を透明性をもって公開すること。"}, "answer": 3, "explanation": "ステークホルダー・エンゲージメントにおいて、企業に都合の悪い意見を無視することは適切ではありません。多様な意見を真摯に受け止め、経営に反映させることが重要です。"}, {"num": 290, "text": "次の記述のうち、「SDGs目標12：つくる責任 つかう責任」に関連する企業の取り組みとして、最も適切なものはどれか。", "options": {"1": "大量生産・大量消費・大量廃棄のビジネスモデルを維持すること。", "2": "製品のライフサイクル全体を通じた環境負荷の低減に取り組むこと。", "3": "消費者に対して、より多くの製品を購入するよう促すこと。", "4": "製品の耐久性を意図的に低下させ、買い替えを促進すること。"}, "answer": 2, "explanation": "SDGs目標12「つくる責任 つかう責任」は、持続可能な消費と生産のパターンを確保することを目指しています。製品のライフサイクル全体を通じた環境負荷の低減は、この目標に直接関連する取り組みです。"}, {"num": 291, "text": "企業が「サステナビリティ・トランスフォーメーション（SX）」を推進する目的として、最も適切なものはどれか。", "options": {"1": "短期的な利益を最大化すること。", "2": "社会のサステナビリティと企業のサステナビリティを同期化させ、中長期的な企業価値向上を実現すること。", "3": "デジタル技術の導入のみを推進すること。", "4": "従業員の削減によるコスト削減を図ること。"}, "answer": 2, "explanation": "サステナビリティ・トランスフォーメーション（SX）は、経済産業省が提唱する概念で、社会のサステナビリティと企業のサステナビリティを同期化させ、中長期的な企業価値向上を実現するための経営変革を指します。"}, {"num": 292, "text": "次の記述のうち、「グリーンボンド」に関する説明として誤っているものはどれか。", "options": {"1": "環境改善効果のあるプロジェクトに資金を充当するために発行される債券である。", "2": "調達資金の使途は環境関連プロジェクトに限定される。", "3": "発行体は資金の使途や環境改善効果について報告する義務がある。", "4": "発行体は必ず環境関連企業でなければならない。"}, "answer": 4, "explanation": "グリーンボンドの発行体は環境関連企業に限定されません。調達資金の使途が環境改善効果のあるプロジェクトに充当されることが条件であり、あらゆる業種の企業や政府機関が発行できます。"}, {"num": 293, "text": "企業が「ダブル・マテリアリティ」の観点からサステナビリティ課題を評価する際に考慮すべき2つの側面は何か。", "options": {"1": "短期的影響と長期的影響。", "2": "企業が社会・環境に与える影響（インパクト・マテリアリティ）と、社会・環境の変化が企業の財務に与える影響（財務マテリアリティ）。", "3": "国内の影響と海外の影響。", "4": "定量的影響と定性的影響。"}, "answer": 2, "explanation": "ダブル・マテリアリティは、企業が社会・環境に与える影響（アウトサイド・イン）と、社会・環境の変化が企業の財務に与える影響（インサイド・アウト）の両方を考慮する概念です。"}, {"num": 294, "text": "次の記述のうち、「スチュワードシップ・コード」に関する説明として最も適切なものはどれか。", "options": {"1": "上場企業が守るべき企業統治の指針である。", "2": "機関投資家が投資先企業との建設的な対話を通じて、企業価値の向上や持続的成長を促すための行動指針である。", "3": "政府が企業に対して環境保全を求めるコードである。", "4": "消費者が企業に対して品質向上を求めるコードである。"}, "answer": 2, "explanation": "スチュワードシップ・コードは機関投資家向けの行動指針です。上場企業向けの企業統治の指針はコーポレートガバナンス・コードです。両者は「車の両輪」として機能します。"}, {"num": 295, "text": "企業が「Scope 3」の排出量を削減するために行うべきこととして、最も適切なものはどれか。", "options": {"1": "自社工場のエネルギー効率のみを改善すること。", "2": "サプライヤーや顧客を含むバリューチェーン全体で、排出削減に向けた協力・連携を行うこと。", "3": "Scope 3の排出量は自社でコントロールできないため、何もしないこと。", "4": "自社のScope 1・2の排出量のみを報告すること。"}, "answer": 2, "explanation": "Scope 3の排出量は、サプライチェーンの上流（原材料調達、輸送など）から下流（製品の使用、廃棄など）まで広範囲にわたるため、サプライヤーや顧客との協力・連携が不可欠です。"}, {"num": 296, "text": "次の記述のうち、「Just Transition（公正な移行）」に関する説明として最も適切なものはどれか。", "options": {"1": "すべての国が同時に脱炭素を達成すること。", "2": "脱炭素社会への移行に伴い、影響を受ける労働者や地域社会に対して、再教育や雇用支援などの公正な支援を行うこと。", "3": "先進国が途上国に対して資金援助を行うこと。", "4": "化石燃料産業を即座に廃止すること。"}, "answer": 2, "explanation": "Just Transition（公正な移行）は、脱炭素社会への移行過程で、化石燃料産業の労働者や関連地域が不公正な影響を受けないよう、再教育、再就職支援、地域経済の多角化などの公正な支援を行うことを指します。"}, {"num": 297, "text": "企業が「非財務情報」の開示を強化する背景として、最も適切なものはどれか。", "options": {"1": "非財務情報の開示は企業のコスト削減につながるため。", "2": "投資家やステークホルダーが、企業の長期的な価値創造能力を評価するために、財務情報だけでは不十分であると認識するようになったため。", "3": "非財務情報の開示が法律で義務付けられているため（すべての企業に対して）。", "4": "非財務情報を開示すると、株価が必ず上昇するため。"}, "answer": 2, "explanation": "企業の長期的な価値創造能力を評価するには、財務情報だけでなく、ESGに関する取り組み、人的資本、知的資本、自然資本などの非財務情報が重要であるとの認識が広がっています。"}, {"num": 298, "text": "次の記述のうち、「プラネタリー・バウンダリー」に関する説明として誤っているものはどれか。", "options": {"1": "人類が安全に活動できる範囲の境界を科学的に定義したものである。", "2": "気候変動、生物多様性の損失、窒素・リンの循環など、9つのプロセスが定義されている。", "3": "すべてのプロセスにおいて、現在の状況は安全な範囲内にある。", "4": "境界を超えると、地球環境が不可逆的に変化するリスクがある。"}, "answer": 3, "explanation": "プラネタリー・バウンダリーの9つのプロセスのうち、気候変動、生物多様性の損失、窒素・リンの循環、土地利用の変化、新規化学物質など、複数のプロセスですでに安全な範囲を超えているとされています。"}, {"num": 299, "text": "企業のサプライチェーンにおける人権リスクへの対応として、最も重要とされる最初のステップは何か。", "options": {"1": "問題が発生した従業員を解雇すること。", "2": "サプライヤーとの取引を直ちに停止すること。", "3": "人権方針を策定し、サプライヤーを含む関係者に周知すること。", "4": "問題が外部に漏れないように情報を隠蔽すること。"}, "answer": 3, "explanation": "「ビジネスと人権に関する指導原則」では、企業が人権を尊重する責任を果たすための最初のステップとして、人権方針の策定と公表が求められています。その上で、人権デュー・ディリジェンスを実施し、リスクの特定・防止・軽減に取り組みます。"}, {"num": 300, "text": "企業のサステナビリティ報告に関する近年の動向として、最も適切なものはどれか。", "options": {"1": "報告書の作成は完全に任意であり、作成する企業は減少傾向にある。", "2": "財務情報と非財務情報（サステナビリティ情報）を統合して報告する「統合報告」の考え方が広がっている。", "3": "ポジティブな情報のみを開示し、ネガティブな情報は開示しないのが一般的である。", "4": "報告書の読者は株主や投資家に限定されており、他のステークホルダーは重視されない。"}, "answer": 2, "explanation": "近年、財務情報と非財務情報（サステナビリティ情報）を統合して報告する「統合報告」の考え方が広がっています。ISSBによる国際的な基準の策定や、各国での法制化の動きも進んでいます。"}]}];
let state={title:'',list:[],chapterIndex:null,qIndex:0,answers:[],answered:false};
const $=id=>document.getElementById(id);
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active');window.scrollTo(0,0);}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function renderStart(){
  const list=$('exam-list');list.innerHTML='';
  const mk=(tag,title,sub,count,fn)=>{
    const c=document.createElement('div');c.className='exam-card';
    c.innerHTML='<div class="tag">'+tag+'</div><h2>'+title+'</h2><p class="sub">'+sub+'</p><div class="meta"><span>全'+count+'問</span><div class="go">はじめる <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></div></div>';
    c.addEventListener('click',fn);list.appendChild(c);
  };
  mk('RANDOM','全300問からランダム20問','毎回違う問題で力試し',20,()=>{
    const all=[].concat(...CHAPTERS.map(c=>c.questions));
    start('ランダム20問',shuffle(all).slice(0,20),null);
  });
  CHAPTERS.forEach((ch,i)=>{
    const a=ch.questions[0].num,b=ch.questions[ch.questions.length-1].num;
    mk('CHAPTER '+ch.id,ch.title,'問'+a+'〜問'+b,ch.questions.length,()=>start(ch.title,ch.questions,i));
  });
}
function start(title,questions,ci){
  state.title=title;state.list=questions;state.chapterIndex=ci;state.qIndex=0;
  state.answers=new Array(questions.length).fill(null);
  $('hdr-exam-name').textContent=title.length>12?title.slice(0,12)+'…':title;
  renderQuestion();showScreen('screen-quiz');
}
function renderQuestion(){
  const q=state.list[state.qIndex];state.answered=false;
  $('q-theme').textContent='問'+q.num;
  $('q-text').textContent=q.text;
  const w=$('q-options');w.innerHTML='';
  ['1','2','3','4'].forEach(k=>{
    if(!(k in q.options))return;
    const d=document.createElement('div');d.className='option';d.dataset.k=k;
    d.innerHTML='<span class="lab">'+k+'</span><span>'+q.options[k]+'</span>';
    d.addEventListener('click',()=>choose(k));w.appendChild(d);
  });
  $('explain-panel').classList.remove('show');
  $('hdr-qnum').textContent=state.qIndex+1;$('hdr-qtotal').textContent=state.list.length;
  $('progress-fill').style.width=(state.qIndex/state.list.length*100)+'%';
  window.scrollTo(0,0);
}
function choose(k){
  if(state.answered)return;state.answered=true;
  const q=state.list[state.qIndex];const ok=(+k===q.answer);
  state.answers[state.qIndex]={sel:+k,ok:ok};
  document.querySelectorAll('.option').forEach(o=>{
    o.classList.add('disabled');
    if(+o.dataset.k===q.answer)o.classList.add('correct');
    else if(o.dataset.k===k)o.classList.add('wrong');
    else o.classList.add('faded');
  });
  $('verdict-badge').textContent=ok?'正解':'不正解';
  $('verdict-badge').className='verdict-badge '+(ok?'ok':'ng');
  $('explain-answer').textContent=q.answer+'　'+q.options[q.answer];
  $('explain-text').textContent=q.explanation;
  requestAnimationFrame(()=>$('explain-panel').classList.add('show'));
}
$('btn-next').addEventListener('click',()=>{
  $('explain-panel').classList.remove('show');
  setTimeout(()=>{
    if(state.qIndex<state.list.length-1){state.qIndex++;renderQuestion();}else showResult();
  },200);
});
function showResult(){
  const n=state.answers.filter(a=>a&&a.ok).length;
  $('result-exam-name').textContent=state.title+' — RESULT';
  $('result-score').textContent=n;$('result-total').textContent='/ '+state.list.length;
  const g=$('rgrid');g.innerHTML='';
  state.answers.forEach((a,i)=>{
    const c=document.createElement('div');c.className='cell '+(a&&a.ok?'ok':'ng');
    c.textContent=state.list[i].num;c.addEventListener('click',()=>review(i));g.appendChild(c);
  });
  $('btn-wrong').style.display=n<state.list.length?'block':'none';
  showScreen('screen-result');
}
function review(i){
  const q=state.list[i],a=state.answers[i];let h='';
  ['1','2','3','4'].forEach(k=>{
    if(!(k in q.options))return;
    const cls=+k===q.answer?'correct':(a&&+k===a.sel?'wrong':'');
    h+='<div class="ropt '+cls+'">'+k+'．'+q.options[k]+'</div>';
  });
  $('review-sheet').innerHTML='<button class="close-x" id="rc">✕</button><div class="rq-theme">問'+q.num+'</div><div class="rq-text">'+q.text+'</div>'+h+'<div class="rexp"><strong>'+(a&&a.ok?'正解':'不正解')+'</strong>／正答：'+q.answer+'<br><br>'+q.explanation+'</div>';
  $('review-overlay').classList.add('show');
  $('rc').addEventListener('click',()=>$('review-overlay').classList.remove('show'));
}
$('review-overlay').addEventListener('click',e=>{if(e.target.id==='review-overlay')e.target.classList.remove('show')});
$('btn-retry').addEventListener('click',()=>start(state.title,state.chapterIndex===null?shuffle(state.list):state.list,state.chapterIndex));
$('btn-wrong').addEventListener('click',()=>{
  const wrong=state.list.filter((q,i)=>!(state.answers[i]&&state.answers[i].ok));
  start('間違えた問題の復習',wrong,null);
});
$('btn-home').addEventListener('click',()=>showScreen('screen-start'));
renderStart();
</script>
